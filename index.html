<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小八的家 - 第三人称</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
            user-select: none;
            border-left: 4px solid #f1c40f;
        }
        #interact-hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 18px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        #interact-hint.visible { opacity: 1; }
        #action-feedback {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            background: rgba(0,0,0,0.5);
            padding: 8px 24px;
            border-radius: 40px;
        }
        #action-feedback.show { opacity: 1; }
        #controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            background: rgba(0,0,0,0.4);
            padding: 6px 18px;
            border-radius: 20px;
            pointer-events: none;
            white-space: nowrap;
        }

        /* ====== 闪回效果叠加层 ====== */
        #flashback-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }
        /* sepia 暖色怀旧滤镜 */
        #flashback-overlay.active {
            opacity: 1;
        }
        #flashback-overlay .sepia-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(112, 66, 20, 0.35);
            filter: blur(2px) sepia(0.7) saturate(0.8);
        }
        /* 模糊层 */
        #flashback-overlay .blur-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }
        /* 闪回文字 */
        #flashback-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Comic Sans MS', 'YouYuan', cursive, sans-serif;
            font-size: clamp(20px, 3.5vw, 36px);
            color: #FFE4B5;
            text-shadow:
                0 0 10px rgba(255, 228, 181, 0.8),
                0 0 30px rgba(255, 180, 80, 0.5),
                0 2px 8px rgba(0, 0, 0, 0.7);
            text-align: center;
            line-height: 1.6;
            max-width: 80vw;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            white-space: pre-line;
            letter-spacing: 0.05em;
        }
        #flashback-overlay.active #flashback-text {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="info">🐶 小八的家 | 卧室 · 客厅 · 厨房 · 卫生间</div>
    <div id="interact-hint">按 <kbd>E</kbd> 互动</div>
    <div id="action-feedback"></div>
    <div id="controls-hint">WASD 移动 · 空格 跳跃 · 鼠标拖动视角 · 滚轮缩放</div>
    <div id="pos-display" style="position:absolute;top:20px;right:20px;background:rgba(0,0,0,0.7);color:#0f0;padding:8px 14px;border-radius:6px;font-size:13px;font-family:monospace;pointer-events:none;z-index:100;"></div>

    <!-- 闪回效果叠加层 -->
    <div id="flashback-overlay">
        <div class="blur-layer"></div>
        <div class="sepia-layer"></div>
        <div id="flashback-text">总是满的...<br>但最近没什么味道了。</div>
    </div>
    <!-- 玩具球闪回叠加层 -->
    <div id="flashback-ball-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9999;opacity:0;transition:opacity 1.2s ease-in-out;">
        <div style="position:absolute;top:0;left:0;width:100%;height:100%;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);"></div>
        <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(112,66,20,0.35);filter:blur(2px) sepia(0.7) saturate(0.8);"></div>
        <div id="flashback-ball-text" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Comic Sans MS','YouYuan',cursive,sans-serif;font-size:clamp(18px,3vw,30px);color:#FFE4B5;text-shadow:0 0 10px rgba(255,228,181,0.8),0 0 30px rgba(255,180,80,0.5),0 2px 8px rgba(0,0,0,0.7);text-align:center;line-height:1.6;max-width:80vw;opacity:0;transition:opacity 1s ease-in-out;white-space:pre-line;letter-spacing:0.05em;">这个球是主人最常扔的…<br>我已经很久没有追过它了。</div>
    </div>
    <!-- 遥控器闪回叠加层 -->
    <div id="flashback-remote-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9999;opacity:0;transition:opacity 1.2s ease-in-out;">
        <div style="position:absolute;top:0;left:0;width:100%;height:100%;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);"></div>
        <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(112,66,20,0.35);filter:blur(2px) sepia(0.7) saturate(0.8);"></div>
        <div id="flashback-remote-text" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Comic Sans MS','YouYuan',cursive,sans-serif;font-size:clamp(16px,2.8vw,28px);color:#FFE4B5;text-shadow:0 0 10px rgba(255,228,181,0.8),0 0 30px rgba(255,180,80,0.5),0 2px 8px rgba(0,0,0,0.7);text-align:center;line-height:1.6;max-width:80vw;opacity:0;transition:opacity 1s ease-in-out;white-space:pre-line;letter-spacing:0.05em;">以前主人抱着我一起看电视…<br>现在他的眼睛不再看屏幕了。</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        // ==================== 场景初始化 ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xD4C5A9);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ==================== 灯光 ====================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffeedd, 0x8d7c6b, 0.6);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfff8e7, 0.6);
        dirLight.position.set(3, 6, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 12;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 25;
        scene.add(dirLight);

        // ==================== 9m × 9m 房子盒子 ====================
        const houseHalf = 4.5;
        const wallH = 2.8;
        const wallThick = 0.15;
        const wallColor = 0xD4C5A9;

        // ==================== 碰撞体积系统 ====================
        // colliders 存放所有 AABB 碰撞盒，格式：{ minX, maxX, minZ, maxZ }
        const colliders = [];
        const playerRadius = 0.25; // 法斗碰撞半径（米）

        function addCollider(cx, cz, halfW, halfD, showBox = false, boxH = 1.0, boxY = 0.5, isPlatform = false) {
            colliders.push({
                minX: cx - halfW,
                maxX: cx + halfW,
                minZ: cz - halfD,
                maxZ: cz + halfD,
                platformTop: isPlatform ? boxY + boxH / 2 : -Infinity  // 平台顶部高度
            });
            if (showBox) {
                const boxGeo = new THREE.BoxGeometry(halfW * 2, boxH, halfD * 2);
                const boxMat = new THREE.MeshBasicMaterial({ color: isPlatform ? 0x44ff44 : 0xff4444, transparent: true, opacity: 0.3, wireframe: true });
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(cx, boxY, cz);
                scene.add(box);
            }
        }

        function addWall(x, z, w, d) {
            const geo = new THREE.BoxGeometry(w, wallH, d);
            const mat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.7 });
            const wall = new THREE.Mesh(geo, mat);
            wall.position.set(x, wallH / 2, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            // 同步注册碰撞体积
            addCollider(x, z, w / 2, d / 2);
            return wall;
        }

        // 四面墙壁
        addWall(0, -houseHalf, 9, wallThick);          // 前
        addWall(0, houseHalf - 1.0, 9, wallThick);     // 后（内移1单位，靠近厨房卫生间）
        addWall(-houseHalf, 0, wallThick, 9);          // 左
        addWall(houseHalf, 0, wallThick, 9);           // 右

        // ==================== 地板 ====================
        // 地板覆盖到后墙位置（Z: -4.5 ~ 3.5）
        const floorGeo = new THREE.PlaneGeometry(9, 8);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xD4A76A, roughness: 0.45, metalness: 0.03 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, 0.01, -0.5);
        floor.receiveShadow = true;
        scene.add(floor);

        // 木地板纹理线
        for (let i = -4.5; i <= 4.5; i += 0.5) {
            const lineGeo = new THREE.BoxGeometry(0.025, 0.005, 9);
            const lineMat = new THREE.MeshStandardMaterial({ color: 0xB8895A, roughness: 0.6 });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.position.set(i, 0.015, 0);
            line.receiveShadow = true;
            scene.add(line);
        }
        for (let i = -4.5; i <= 4.5; i += 0.5) {
            const lineGeo2 = new THREE.BoxGeometry(9, 0.005, 0.025);
            const lineMat = new THREE.MeshStandardMaterial({ color: 0xB8895A, roughness: 0.6 });
            const line2 = new THREE.Mesh(lineGeo2, lineMat);
            line2.position.set(0, 0.015, i);
            line2.receiveShadow = true;
            scene.add(line2);
        }

        // 卧室床碰撞体（卧室在 X=-1.65, Z=-2.0，床靠左侧墙）
        addCollider(-1.65 - 0.1, -2.0 - 1.15, 0.9, 1.0, true, 0.6, 0.3);

        // 客厅碰撞体（客厅在 X=2.5, Z=-2.0）
        addCollider(2.5 - 0.8 + 0.4 - 0.2, -2.0 + 0.675, 0.5, 0.75, true, 1.0, 0.5);

        // 卫生间抬升区域：3m×3m×0.2m（仅可视化+抬升用，不阻挡移动）
        (function() {
            const cx = 2.5, cz = 1.65, hw = 1.5, hd = 1.5;
            const boxGeo = new THREE.BoxGeometry(hw * 2, 0.2, hd * 2);
            const boxMat = new THREE.MeshBasicMaterial({ color: 0x44ff44, transparent: true, opacity: 0.25, wireframe: true });
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.set(cx, 0.1, cz); // 顶面在0.2m
            scene.add(box);
        })();

        // 卫生间+Z侧后半区碰撞体积（Z从中点到最大值之间的一半）
        addCollider(2.5, 2.775, 1.5, 0.375, true, 1.6, 1.0);

        // 以上述碰撞体X和Z最大值点(4.0, 3.15)为轴心顺时针旋转90°得到的新碰撞体
        // 原中心(2.5,2.775) → 新中心(4.375, 1.65)，尺寸互换: 0.375×1.5
        addCollider(3.375, 1.65, 0.375, 1.5, true, 1.6, 1.0);

        // ==================== 天花板 ====================
        const ceilGeo = new THREE.PlaneGeometry(9, 9);
        const ceilMat = new THREE.MeshStandardMaterial({ color: 0xF5F0E8, roughness: 0.7, side: THREE.DoubleSide });
        const ceiling = new THREE.Mesh(ceilGeo, ceilMat);
        ceiling.rotation.x = -Math.PI / 2;
        ceiling.position.set(0, wallH, 0);
        ceiling.receiveShadow = true;
        scene.add(ceiling);

        // ==================== 点光源 ====================
        const lightPositions = [
            { x: -2.2, z: -2.2 }, { x: 2.2, z: -2.2 },
            { x: -2.2, z: 2.2 },  { x: 2.2, z: 2.2 }
        ];
        lightPositions.forEach(lp => {
            const pl = new THREE.PointLight(0xfff5e6, 0.6, 7);
            pl.position.set(lp.x, 2.2, lp.z);
            scene.add(pl);
        });

        const centerLight = new THREE.PointLight(0xfffae6, 1.0, 12);
        centerLight.position.set(0, 2.5, 0);
        scene.add(centerLight);

        // ==================== 房间模型加载 ====================
        const gltfLoader = new GLTFLoader();

        // 玩具球引用（客厅加载后填充）
        let toyBallMesh = null;

        function loadObjRoom(objFile, mtlFile, scale, posX, posZ, rotY, label) {
            const mtlLoader = new MTLLoader();
            mtlLoader.load(mtlFile, (materials) => {
                materials.preload();
                const objLoader = new OBJLoader();
                objLoader.setMaterials(materials);
                objLoader.load(objFile, (room) => {
                    room.scale.set(scale, scale, scale);
                    room.position.set(posX, 0, posZ);
                    room.rotation.y = rotY;
                    room.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            // 查找玩具球：名称为"球体.019"的mesh
                            if (label === '客厅' && child.name === '球体.019') {
                                toyBallMesh = child;
                                console.log('🏀 玩具球已找到！', child.name);
                            }
                        }
                    });
                    scene.add(room);
                    console.log(`✅ ${label} (OBJ) 加载成功！`);
                }, undefined, (error) => {
                    console.error(`❌ ${label} OBJ加载失败:`, error);
                });
            }, undefined, (error) => {
                console.error(`❌ ${label} MTL加载失败:`, error);
            });
        }

        function loadRoom(filename, scale, posX, posZ, rotY, label, addColl = false) {
            gltfLoader.load(filename, (gltf) => {
                const room = gltf.scene;
                room.scale.set(scale, scale, scale);
                room.position.set(posX, 0, posZ);
                room.rotation.y = rotY;
                room.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                scene.add(room);

                // 如果需要自动添加碰撞体（用于厨房桌子等）
                if (addColl) {
                    // 只计算Y>0.25m的对象（桌面和桌腿，排除地板/地毯）
                    const tableBox = new THREE.Box3();
                    room.traverse((child) => {
                        if (child.isMesh) {
                            const childBox = new THREE.Box3().setFromObject(child);
                            // 只取世界Y坐标>0.25m的部分（桌面高度）
                            if (childBox.max.y > 0.25) {
                                tableBox.union(childBox);
                            }
                        }
                    });
                    const cx = (tableBox.min.x + tableBox.max.x) / 2;
                    const cz = (tableBox.min.z + tableBox.max.z) / 2;
                    const hw = (tableBox.max.x - tableBox.min.x) / 2;
                    const hd = (tableBox.max.z - tableBox.min.z) / 2;
                    const th = tableBox.max.y - tableBox.min.y;
                    const ty = (tableBox.min.y + tableBox.max.y) / 2;
                    console.log(`📦 ${label} 碰撞体: center=(${cx.toFixed(2)}, ${cz.toFixed(2)}), size=${(hw*2).toFixed(2)}×${(hd*2).toFixed(2)}, 高=${th.toFixed(2)}`);
                    addCollider(cx, cz, hw, hd, true, th, ty);
                }

                console.log(`✅ ${label} 加载成功！`);
            }, undefined, (error) => {
                console.error(`❌ ${label} 加载失败:`, error);
            });
        }

        // 四个房间均匀分布在 9m×9m 空间内
        const spacingX = 2.5;
        const spacingZ = 2.0;
        const bedroomOffsetX = 0.85; // 卧室往客厅方向微调
        const kitchenOffsetZ = 0.5;  // 厨房往卧室方向微调
        const bathroomOffsetZ = 0.35; // 卫生间往客厅方向微调
        loadRoom('rooms/bedroom.glb',   0.5, -spacingX + bedroomOffsetX, -spacingZ, 0,              '卧室');
        loadObjRoom('rooms/livingroom.obj', 'rooms/livingroom.mtl', 0.5, spacingX, -spacingZ, -Math.PI/2, '客厅');
        loadRoom('rooms/kitchen.glb',   0.5, -spacingX,  spacingZ - kitchenOffsetZ, Math.PI/2,      '厨房', false);
        loadRoom('rooms/bathroom.glb',  0.5,  spacingX,  spacingZ - bathroomOffsetZ, Math.PI,       '卫生间');

        // 过渡墙体：厨房与卫生间之间的浅棕色连接墙
        const wallStartX = -spacingX + 1.5;
        const wallEndX = spacingX - 1.5;
        const wallCenterX = (wallStartX + wallEndX) / 2;
        const wallLength = wallEndX - wallStartX;
        const wallZ = (spacingZ - kitchenOffsetZ + spacingZ - bathroomOffsetZ) / 2 + 1.6;
        const wallGeo = new THREE.BoxGeometry(wallLength, 2.8, 0.3);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xE2A66D, roughness: 0.45, metalness: 0.03 });
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(wallCenterX, 1.4, wallZ);
        wall.castShadow = true;
        wall.receiveShadow = true;
        scene.add(wall);
        addCollider(wallCenterX, wallZ, wallLength / 2, 0.15); // 过渡墙1碰撞体积
        console.log('🧱 厨房-卫生间过渡墙已创建');

        // 过渡墙前面的装饰模型（摇篮椅）
        gltfLoader.load('models/transition_deco.glb', (gltf) => {
            const deco = gltf.scene;
            deco.scale.set(0.5, 0.5, 0.5);
            const chairPosX = wallCenterX + 0.1;   // ≈ 0.1
            const chairPosZ = wallZ + 0.95;         // ≈ 4.125
            deco.position.set(chairPosX, 0.3, chairPosZ);
            deco.rotation.y = Math.PI / 2;
            deco.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            scene.add(deco);

            // 用 Three.js 自动计算世界坐标系中的精确包围盒
            const box = new THREE.Box3().setFromObject(deco);
            const cx = (box.min.x + box.max.x) / 2;
            const cz = (box.min.z + box.max.z) / 2;
            const hw = (box.max.x - box.min.x) / 2;
            const hd = (box.max.z - box.min.z) / 2;
            console.log(`🪑 摇篮椅包围盒: center=(${cx.toFixed(2)}, ${cz.toFixed(2)}), size=${(hw*2).toFixed(2)}×${(hd*2).toFixed(2)}, Z=[${box.min.z.toFixed(2)}, ${box.max.z.toFixed(2)}]`);
            
            addCollider(cx, cz, hw, hd, true, 1.22, 0.91);
        });

        // 过渡墙2：卫生间与客厅之间
        const wall2StartZ = -spacingZ + 1.5;
        const wall2EndZ = spacingZ - bathroomOffsetZ - 1.5;
        const wall2CenterZ = (wall2StartZ + wall2EndZ) / 2;
        const wall2Length = wall2EndZ - wall2StartZ;
        const wall2X = spacingX + 1.8;
        const wall2Geo = new THREE.BoxGeometry(0.3, 2.8, wall2Length);
        const wall2Mat = new THREE.MeshStandardMaterial({ color: 0xE2A66D, roughness: 0.45, metalness: 0.03 });
        const wall2 = new THREE.Mesh(wall2Geo, wall2Mat);
        wall2.position.set(wall2X, 1.4, wall2CenterZ);
        wall2.castShadow = true;
        wall2.receiveShadow = true;
        scene.add(wall2);
        addCollider(wall2X, wall2CenterZ, 0.15, wall2Length / 2); // 过渡墙2碰撞体积
        console.log('🧱 卫生间-客厅过渡墙已创建');

        // ==================== 路径 ====================
        const pathR = 3.5;
        const pathPoints = [
            { x: -pathR, z: -pathR }, { x: 0, z: -pathR }, { x: pathR, z: -pathR },
            { x: pathR, z: 0 }, { x: pathR, z: pathR },
            { x: 0, z: pathR }, { x: -pathR, z: pathR },
            { x: -pathR, z: 0 }, { x: -pathR, z: -pathR }
        ];
        const pathMat = new THREE.MeshStandardMaterial({
            color: 0xF9E79F, roughness: 0.3, transparent: true, opacity: 0.5,
            emissive: 0xF9E79F, emissiveIntensity: 0.3
        });
        for (let i = 0; i < pathPoints.length - 1; i++) {

        // ==================== 第三人称控制 ====================

                lastMouseY = e.pageY;
            }
        });
        renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('mouseup', () => { isMouseDown = false; isRightDown = false; });
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown && !isRightDown) return;
            const dx = e.pageX - lastMouseX;
            const dy = e.pageY - lastMouseY;
            lastMouseX = e.pageX;
            lastMouseY = e.pageY;

            if (isMouseDown) {
                cameraYaw -= dx * mouseSensitivity;
                cameraPitch -= dy * mouseSensitivity;
                cameraPitch = Math.max(0.15, Math.min(Math.PI / 2 - 0.1, cameraPitch));
            }
            if (isRightDown) {
                cameraDistance += dy * 0.01;
                cameraDistance = Math.max(minDist, Math.min(maxDist, cameraDistance));
            }
        });

        renderer.domElement.addEventListener('wheel', (e) => {
            cameraDistance += e.deltaY * 0.01;
            cameraDistance = Math.max(minDist, Math.min(maxDist, cameraDistance));
            e.preventDefault();
        }, { passive: false });

        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isMouseDown = true;
                lastMouseX = e.touches[0].pageX;
                lastMouseY = e.touches[0].pageY;
            }
            if (e.touches.length === 2) {
                isMouseDown = false;
                const dx = e.touches[0].pageX - e.touches[1].pageX;
                const dy = e.touches[0].pageY - e.touches[1].pageY;
                lastMouseX = Math.sqrt(dx * dx + dy * dy);
            }
        });
        window.addEventListener('touchend', () => { isMouseDown = false; });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isMouseDown) {
                const dx = e.touches[0].pageX - lastMouseX;
                const dy = e.touches[0].pageY - lastMouseY;
                lastMouseX = e.touches[0].pageX;
                lastMouseY = e.touches[0].pageY;
                cameraYaw -= dx * mouseSensitivity;
                cameraPitch -= dy * mouseSensitivity;
                cameraPitch = Math.max(0.15, Math.min(Math.PI / 2 - 0.1, cameraPitch));
            }
            if (e.touches.length === 2) {

                const dy = e.touches[0].pageY - e.touches[1].pageY;
                const dist = Math.sqrt(dx * dx + dy * dy);

        // 检测点 (px, pz) 与某个 collider 是否重叠（含玩家半径）
        function resolveColliders(px, pz) {
            let rx = px, rz = pz;
            for (const c of colliders) {
                const expandedMinX = c.minX - playerRadius;
                const expandedMaxX = c.maxX + playerRadius;
                const expandedMinZ = c.minZ - playerRadius;
                const expandedMaxZ = c.maxZ + playerRadius;

                if (rx > expandedMinX && rx < expandedMaxX &&
                    rz > expandedMinZ && rz < expandedMaxZ) {
                    // 计算从哪个轴推出穿透量最小
                    const overlapLeft  = rx - expandedMinX;
                    const overlapRight = expandedMaxX - rx;
                    const overlapFront = rz - expandedMinZ;
                    const overlapBack  = expandedMaxZ - rz;
                    const minOverlap = Math.min(overlapLeft, overlapRight, overlapFront, overlapBack);

                    if (minOverlap === overlapLeft)       rx = expandedMinX;
                    else if (minOverlap === overlapRight) rx = expandedMaxX;
                    else if (minOverlap === overlapFront) rz = expandedMinZ;
                    else                                  rz = expandedMaxZ;
                }
            }
            return { x: rx, z: rz };
        }

        function updateMovement(dt) {
            const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw)).normalize();
            const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw)).normalize();

            playerDir.set(0, 0, 0);
            if (keyState.w) playerDir.add(forward);
            if (keyState.s) playerDir.sub(forward);
            if (keyState.a) playerDir.sub(right);
            if (keyState.d) playerDir.add(right);

            if (playerDir.length() > 0) {
                playerDir.normalize();
                const move = playerDir.clone().multiplyScalar(moveSpeed * dt);

                // 先分轴移动，再各自做碰撞解算（防止角落卡死）
                let newX = bulldogGroup.position.x + move.x;
                let newZ = bulldogGroup.position.z + move.z;

                // 世界边界（四面外墙内侧）
                newX = Math.max(-4.2, Math.min(4.2, newX));
                newZ = Math.max(-4.2, Math.min(4.2, newZ));

                // 碰撞解算：先只移动 X 轴
                const afterX = resolveColliders(newX, bulldogGroup.position.z);
                newX = afterX.x;
                // 再只移动 Z 轴
                const afterZ = resolveColliders(newX, newZ);
                newZ = afterZ.z;

                bulldogGroup.position.x = newX;
                bulldogGroup.position.z = newZ;

                const targetAngle = Math.atan2(move.x, move.z);
                let angleDiff = targetAngle - bulldogGroup.rotation.y;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                bulldogGroup.rotation.y += angleDiff * Math.min(1, dt * 8);
            }

            // ---- 卫生间区域自动抬升（走到碰撞体上自动站到0.2m高）----
            const BATHROOM_RISE_Y = 0.2;
            const bathroomCX = 2.5, bathroomCZ = 1.65, bathroomHW = 1.5, bathroomHD = 1.5;
            const inBathroomArea = bulldogGroup.position.x >= bathroomCX - bathroomHW - playerRadius &&
                                     bulldogGroup.position.x <= bathroomCX + bathroomHW + playerRadius &&
                                     bulldogGroup.position.z >= bathroomCZ - bathroomHD - playerRadius &&
                                     bulldogGroup.position.z <= bathroomCZ + bathroomHD + playerRadius;

            // ---- 跳跃 / 重力 / 平台 ----
            const prevY = bulldogGroup.position.y;
            velocityY += gravity * dt;
            bulldogGroup.position.y += velocityY * dt;
            const curY = bulldogGroup.position.y;

            const px = bulldogGroup.position.x;
            const pz = bulldogGroup.position.z;
            let landedPlatformY = -Infinity;

            for (const c of colliders) {
                if (c.platformTop > -Infinity && c.platformTop >= groundY) {
                    if (px >= c.minX - playerRadius && px <= c.maxX + playerRadius &&
                        pz >= c.minZ - playerRadius && pz <= c.maxZ + playerRadius) {
                        if (prevY >= c.platformTop && curY <= c.platformTop) {
                            landedPlatformY = Math.max(landedPlatformY, c.platformTop);
                        }
                    }
                }
            }

            if (landedPlatformY > -Infinity) {
                bulldogGroup.position.y = landedPlatformY;
                velocityY = 0;
                isOnGround = true;
            } else if (inBathroomArea && bulldogGroup.position.y < BATHROOM_RISE_Y) {
                // 在卫生间碰撞体范围内且未跳起 → 抬升到0.2m
                bulldogGroup.position.y = BATHROOM_RISE_Y;
                velocityY = 0;
                isOnGround = true;
            } else if (bulldogGroup.position.y <= groundY) {
                bulldogGroup.position.y = groundY;
                velocityY = 0;
                isOnGround = true;
            } else {
                isOnGround = false;
            }
        }

        function updateCamera() {
            smoothYaw += (cameraYaw - smoothYaw) * smoothFactor;
            smoothPitch += (cameraPitch - smoothPitch) * smoothFactor;
            smoothDist += (cameraDistance - smoothDist) * smoothFactor;

            const target = new THREE.Vector3(
                bulldogGroup.position.x,
                bulldogGroup.position.y + 0.35,
                bulldogGroup.position.z
            );

            let camX = target.x + smoothDist * Math.sin(smoothYaw) * Math.cos(smoothPitch);
            let camY = target.y + smoothDist * Math.sin(smoothPitch);
            let camZ = target.z + smoothDist * Math.cos(smoothYaw) * Math.cos(smoothPitch);

            camX = Math.max(-4.0, Math.min(4.0, camX));
            camZ = Math.max(-4.0, Math.min(4.0, camZ));
            camY = Math.max(0.3, Math.min(4.0, camY)); // 上限提高以跟随跳跃

            camera.position.set(camX, camY, camZ);
            camera.lookAt(target);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let walkCycle = 0;

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);

            updateMovement(dt);
            updateCamera();
            updateInteractionHints();

            // 实时位置显示
            const posEl = document.getElementById('pos-display');
            if (posEl) {
                const p = bulldogGroup.position;
                posEl.textContent = `X: ${p.x.toFixed(2)}  Z: ${p.z.toFixed(2)}  Y: ${p.y.toFixed(2)}`;
            }

            const time = Date.now() * 0.001;
            const isMoving = keyState.w || keyState.a || keyState.s || keyState.d;

            if (bulldogGroup.children.length > 0 && bulldogGroup.children[0]) {
                const model = bulldogGroup.children[0];
                const modelBaseY = 0.28; // 模型相对于 bulldogGroup 的基础 Y

                if (!isOnGround) {
                    // 空中：通过 bulldogGroup 做轻微拉伸，不碰 model.scale
                    model.position.y = modelBaseY;
                    model.rotation.x = 0;
                    model.rotation.z = 0;
                    const stretchY = velocityY > 0 ? 1.08 : 0.92;
                    bulldogGroup.scale.set(1 / stretchY, stretchY, 1 / stretchY);
                } else if (isMoving) {
                    walkCycle += dt * 8;
                    const bounce = Math.abs(Math.sin(walkCycle)) * 0.03;
                    model.position.y = modelBaseY + bounce;
                    bulldogGroup.scale.set(1, 1, 1);
                    model.rotation.x = Math.sin(walkCycle) * 0.08;
                    model.rotation.z = Math.sin(walkCycle * 2) * 0.04;
                } else {
                    model.position.y += (modelBaseY - model.position.y) * 0.1;
                    model.rotation.x += (0 - model.rotation.x) * 0.1;
                    model.rotation.z += (0 - model.rotation.z) * 0.1;
                    walkCycle = 0;
                    const breathe = 1 + Math.sin(time * 3) * 0.015;
                    bulldogGroup.scale.set(breathe, breathe, breathe);
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        console.log('🐶 小八的家已加载！第三人称视角 | WASD移动 | 鼠标拖动旋转 | 滚轮缩放 | E键互动');
    </script>
</body>
</html>
