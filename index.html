<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小八的家 - 第三人称</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }

        /* ====== 游戏开始页面 ====== */
        #start-screen {
            position: fixed;inset:0;z-index:20000;
            display:flex;align-items:center;justify-content:center;
            color:#fff2c7;background:rgba(18,12,8,0.48);
            backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
            transition:opacity 0.65s ease,visibility 0.65s ease;
        }
        #start-screen::before {
            content:"";position:absolute;inset:0;
            background:radial-gradient(circle at center,transparent 10%,rgba(10,6,3,0.28) 100%);
            pointer-events:none;
        }
        #start-screen.is-hidden {opacity:0;visibility:hidden;pointer-events:none;}
        .start-content {position:relative;width:min(90vw,760px);margin-top:-2vh;text-align:center;}
        .start-title {
            margin:0;color:#fff0bd;font-size:clamp(58px,7.5vw,118px);font-weight:900;line-height:1;letter-spacing:0.08em;
            text-shadow:0 5px 0 rgba(91,53,20,0.7),0 8px 24px rgba(0,0,0,0.65),0 0 16px rgba(255,222,144,0.25);
        }
        .start-title-paw {display:inline-block;margin-left:-0.35em;font-size:0.24em;vertical-align:top;transform:translateY(-0.2em) rotate(18deg);}
        .start-subtitle {
            margin:30px 0 64px;color:#ffefc6;font-size:clamp(17px,1.8vw,28px);letter-spacing:0.18em;
            text-shadow:0 3px 10px rgba(0,0,0,0.85);
        }
        #start-game-btn {
            width:min(380px,78vw);padding:20px 30px;border:3px solid rgba(255,236,167,0.9);border-radius:999px;
            color:#5a2b0b;background:linear-gradient(#ffd96a,#ffb817);
            box-shadow:0 7px 0 #d88a08,0 12px 30px rgba(0,0,0,0.45),inset 0 2px 5px rgba(255,255,255,0.7);
            font:700 clamp(24px,2.5vw,38px) "Microsoft YaHei",sans-serif;cursor:pointer;
            transition:transform 0.15s ease,filter 0.15s ease;
        }
        #start-game-btn:hover {filter:brightness(1.08);transform:translateY(-2px);}
        #start-game-btn:active {transform:translateY(4px);box-shadow:0 3px 0 #d88a08,0 7px 18px rgba(0,0,0,0.4);}
        #start-game-btn:focus-visible {outline:4px solid #fff4c7;outline-offset:5px;}
        .start-hint {
            margin-top:30px;color:rgba(255,239,197,0.9);font-size:clamp(14px,1.35vw,20px);letter-spacing:0.08em;
            text-shadow:0 2px 8px #000;
        }
        @media (max-height:650px) {.start-subtitle{margin:20px 0 36px;}.start-hint{margin-top:20px;}}

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
            user-select: none;
            border-left: 4px solid #f1c40f;
        }
        #interact-hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 18px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        #interact-hint.visible { opacity: 1; }
        #action-feedback {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            background: rgba(0,0,0,0.5);
            padding: 8px 24px;
            border-radius: 40px;
        }
        #action-feedback.show { opacity: 1; }
        #controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            background: rgba(0,0,0,0.4);
            padding: 6px 18px;
            border-radius: 20px;
            pointer-events: none;
            white-space: nowrap;
        }

        /* ====== 闪回效果叠加层 ====== */
        #flashback-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }
        /* sepia 暖色怀旧滤镜 */
        #flashback-overlay.active {
            opacity: 1;
        }
        #flashback-overlay .sepia-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(112, 66, 20, 0.35);
            filter: blur(2px) sepia(0.7) saturate(0.8);
        }
        /* 模糊层 */
        #flashback-overlay .blur-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }
        /* 闪回文字 */
        #flashback-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Comic Sans MS', 'YouYuan', cursive, sans-serif;
            font-size: clamp(20px, 3.5vw, 36px);
            color: #FFE4B5;
            text-shadow:
                0 0 10px rgba(255, 228, 181, 0.8),
                0 0 30px rgba(255, 180, 80, 0.5),
                0 2px 8px rgba(0, 0, 0, 0.7);
            text-align: center;
            line-height: 1.6;
            max-width: 80vw;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            white-space: pre-line;
            letter-spacing: 0.05em;
        }
        #flashback-overlay.active #flashback-text {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="info">🐶 小八的家 | 卧室 · 客厅 · 厨房 · 卫生间</div>
    <div id="interact-hint">按 <kbd>E</kbd> 互动</div>
    <div id="action-feedback"></div>
    <div id="controls-hint">WASD 移动 · 空格 跳跃 · 鼠标拖动视角 · 滚轮缩放</div>
    <div id="progress-display" style="position:absolute;top:20px;left:20px;background:rgba(0,0,0,0.65);color:#FFD700;padding:8px 14px;border-radius:6px;font-size:14px;font-family:'Comic Sans MS','YouYuan',cursive,sans-serif;pointer-events:none;z-index:100;display:none;">记忆碎片：0/8</div>
    <div id="narrative-hint" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#FFE4B5;font-family:'Comic Sans MS','YouYuan',cursive,sans-serif;font-size:clamp(16px,2.5vw,26px);text-align:center;pointer-events:none;z-index:9998;opacity:0;transition:opacity 1s;text-shadow:0 0 12px rgba(255,228,181,0.6);max-width:80vw;line-height:1.6;"></div>
    <div id="pos-display" style="position:absolute;top:20px;right:20px;background:rgba(0,0,0,0.7);color:#0f0;padding:8px 14px;border-radius:6px;font-size:13px;font-family:monospace;pointer-events:none;z-index:100;"></div>
    <button id="reset-btn" style="position:absolute;bottom:30px;left:30px;background:rgba(0,0,0,0.6);color:#fff;border:1px solid rgba(255,255,255,0.3);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;z-index:100;">🔄 重新开始</button>
    <button id="hint-bulb-btn" style="position:absolute;bottom:30px;left:150px;background:rgba(0,0,0,0.6);color:#FFD700;border:1px solid rgba(255,215,0,0.4);padding:8px 14px;border-radius:50%;cursor:pointer;font-size:18px;z-index:100;width:42px;height:42px;display:flex;align-items:center;justify-content:center;transition:all 0.3s;" title="提示">💡</button>
    <div id="hint-bulb-guide" style="position:absolute;bottom:85px;left:20px;background:rgba(0,0,0,0.75);color:#FFD700;border:1px solid rgba(255,215,0,0.5);padding:10px 18px;border-radius:10px;font-size:14px;z-index:101;opacity:0;transition:opacity 0.4s;pointer-events:none;max-width:280px;line-height:1.6;"></div>

    <!-- 闪回效果叠加层 -->
    <div id="flashback-overlay">
        <div class="blur-layer"></div>
        <div class="sepia-layer"></div>
        <div id="flashback-text">总是满的...<br>但最近没什么味道了。</div>
    </div>
    <!-- 玩具球闪回叠加层 -->
    <div id="flashback-ball-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9999;opacity:0;transition:opacity 1.2s ease-in-out;">
        <div style="position:absolute;top:0;left:0;width:100%;height:100%;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);"></div>
        <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(112,66,20,0.35);filter:blur(2px) sepia(0.7) saturate(0.8);"></div>
        <div id="flashback-ball-text" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Comic Sans MS','YouYuan',cursive,sans-serif;font-size:clamp(18px,3vw,30px);color:#FFE4B5;text-shadow:0 0 10px rgba(255,228,181,0.8),0 0 30px rgba(255,180,80,0.5),0 2px 8px rgba(0,0,0,0.7);text-align:center;line-height:1.6;max-width:80vw;opacity:0;transition:opacity 1s ease-in-out;white-space:pre-line;letter-spacing:0.05em;">这个球是主人最常扔的…<br>我已经很久没有追过它了。</div>
    </div>
    <!-- 遥控器闪回叠加层 -->
    <div id="flashback-remote-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9999;opacity:0;transition:opacity 1.2s ease-in-out;">
        <div style="position:absolute;top:0;left:0;width:100%;height:100%;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);"></div>
        <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(112,66,20,0.35);filter:blur(2px) sepia(0.7) saturate(0.8);"></div>
        <div id="flashback-remote-text" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Comic Sans MS','YouYuan',cursive,sans-serif;font-size:clamp(16px,2.8vw,28px);color:#FFE4B5;text-shadow:0 0 10px rgba(255,228,181,0.8),0 0 30px rgba(255,180,80,0.5),0 2px 8px rgba(0,0,0,0.7);text-align:center;line-height:1.6;max-width:80vw;opacity:0;transition:opacity 1s ease-in-out;white-space:pre-line;letter-spacing:0.05em;">以前主人抱着我一起看电视…<br>现在他的眼睛不再看屏幕了。</div>
    </div>

    <!-- 钢琴节奏小游戏叠加层 -->
    <div id="piano-game-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;display:none;background:rgba(0,0,0,0.85);">
        <canvas id="piano-canvas"></canvas>
        <div id="piano-game-ui" style="position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;">
            <div id="piano-score" style="color:#FFD700;font-size:28px;font-weight:bold;font-family:'Microsoft YaHei',sans-serif;text-shadow:0 0 10px rgba(255,215,0,0.5);"></div>
            <div id="piano-mistakes" style="color:#FF6B6B;font-size:18px;font-family:'Microsoft YaHei',sans-serif;margin-top:4px;"></div>
        </div>
        <div id="piano-hint" style="position:absolute;top:15%;left:50%;transform:translate(-50%,0);color:rgba(255,255,255,0.7);font-size:18px;font-family:'Microsoft YaHei',sans-serif;pointer-events:none;text-align:center;transition:opacity 0.5s;">🎹 光点落到金线上时，点击对应琴键！<br><span style="font-size:14px;color:rgba(255,255,255,0.4);">允许2次错误</span></div>
        <div id="piano-result" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none;pointer-events:none;">
            <div id="piano-result-text" style="font-family:'Comic Sans MS','YouYuan',cursive,sans-serif;font-size:clamp(16px,2.5vw,24px);color:#FFE4B5;text-shadow:0 0 10px rgba(255,228,181,0.8),0 0 30px rgba(255,180,80,0.5);line-height:1.8;max-width:80vw;"></div>
            <div id="piano-result-hint" style="color:rgba(255,255,255,0.6);font-size:14px;margin-top:20px;font-family:'Microsoft YaHei',sans-serif;">点击任意位置返回</div>
        </div>
        <button onclick="window.skipPiano()" style="position:absolute;bottom:10px;right:10px;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.2);padding:4px 12px;border-radius:15px;font-size:11px;cursor:pointer;z-index:10001;font-family:inherit">跳过 ⏭</button>
    </div>

    <!-- 项圈视角选择叠加层 -->
    <div id="collar-choice-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:10001;display:none;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;flex-direction:column;">
        <div style="color:#FFE4B5;font-size:clamp(18px,2.5vw,28px);font-family:'Microsoft YaHei',sans-serif;margin-bottom:40px;text-shadow:0 0 15px rgba(255,228,181,0.5);">选择一段记忆</div>
        <div style="display:flex;gap:30px;flex-wrap:wrap;justify-content:center;">
            <button id="collar-btn-a" style="background:linear-gradient(135deg,#8B4513,#A0522D);color:#FFE4B5;border:2px solid #D2691E;padding:20px 40px;border-radius:16px;font-size:20px;font-family:'Microsoft YaHei',sans-serif;cursor:pointer;transition:all 0.3s;text-shadow:0 0 10px rgba(255,228,181,0.3);">🐶 小八的记忆<br><span style="font-size:14px;color:rgba(255,228,181,0.6);">第一次戴项圈</span></button>
            <button id="collar-btn-b" style="background:linear-gradient(135deg,#2F4F4F,#3B6B6B);color:#E0FFFF;border:2px solid #5F9EA0;padding:20px 40px;border-radius:16px;font-size:20px;font-family:'Microsoft YaHei',sans-serif;cursor:pointer;transition:all 0.3s;text-shadow:0 0 10px rgba(224,255,255,0.3);">👤 主人的记忆<br><span style="font-size:14px;color:rgba(224,255,255,0.6);">为你戴上项圈</span></button>
        </div>
        <div style="color:rgba(255,255,255,0.4);font-size:14px;margin-top:30px;font-family:'Microsoft YaHei',sans-serif;">按 ESC 关闭</div>
    </div>

    <!-- 项圈视频播放器叠加层 -->
    <div id="collar-video-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:10002;display:none;background:#000;">
        <div id="collar-video-placeholder" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-family:'Microsoft YaHei',sans-serif;">
            <div id="collar-video-title" style="font-size:24px;margin-bottom:20px;color:#FFE4B5;"></div>
            <div id="collar-video-hint" style="font-size:16px;color:rgba(255,255,255,0.5);margin-bottom:30px;">
                视频占位区域<br><span style="font-size:13px;">替换 collar_video_a.mp4 或 collar_video_b.mp4 即可播放</span>
            </div>
            <video id="collar-video-element" style="max-width:90vw;max-height:70vh;display:none;" controls></video>
        </div>
        <div id="collar-video-controls" style="position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:20px;">
            <button id="collar-video-play" style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);padding:10px 24px;border-radius:25px;font-size:16px;cursor:pointer;font-family:'Microsoft YaHei',sans-serif;">▶ 播放</button>
            <button id="collar-video-close" style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);padding:10px 24px;border-radius:25px;font-size:16px;cursor:pointer;font-family:'Microsoft YaHei',sans-serif;">✕ 关闭</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        // ==================== 开始页面 ====================
        if (!sessionStorage.getItem('indexStartScreenShown')) {
            var startScreen = document.createElement('section');
            startScreen.id = 'start-screen';
            startScreen.setAttribute('aria-labelledby','start-title');
            startScreen.innerHTML = '<div class="start-content"><h1 id="start-title" class="start-title">小八的家<span class="start-title-paw" aria-hidden="true">🐾</span></h1><p class="start-subtitle">在熟悉的家里，开启一场记忆之旅</p><button id="start-game-btn" type="button">开始游戏</button><div class="start-hint">点击按钮进入游戏</div></div>';
            document.body.appendChild(startScreen);
            var btn = document.getElementById('start-game-btn');
            if (btn) {
                btn.addEventListener('click', () => {
                    sessionStorage.setItem('indexStartScreenShown', 'true');
                    startScreen.classList.add('is-hidden');
                    setTimeout(() => { startScreen.remove(); }, 700);
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                });
            }
        }

        // ==================== 脚步声合成 ====================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let lastFootstepTime = 0;
        const footstepInterval = 0.35;

        function playFootstep(volume = 1.5, freq = 400) {
            const now = audioCtx.currentTime;
            if (now - lastFootstepTime < footstepInterval) return;
            lastFootstepTime = now;

            const duration = 0.08;
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.1));
            }

            const source = audioCtx.createBufferSource();
            source.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = freq + Math.random() * 200;
            filter.Q.value = 1;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            source.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            source.start(now);
            source.stop(now + duration);
        }

        function playLandSound() {
            const now = audioCtx.currentTime;
            const duration = 0.15;
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.05));
            }
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 150;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(4.5, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            source.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            source.start(now);
            source.stop(now + duration);
        }

        // ==================== 场景初始化 ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xD4C5A9);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ==================== 灯光 ====================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffeedd, 0x8d7c6b, 0.6);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfff8e7, 0.6);
        dirLight.position.set(3, 6, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 12;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 25;
        scene.add(dirLight);

        // ==================== 9m × 9m 房子盒子 ====================
        const houseHalf = 4.5;
        const wallH = 2.8;
        const wallThick = 0.15;
        const wallColor = 0xD4C5A9;

        // ==================== 碰撞体积系统 ====================
        // colliders 存放所有 AABB 碰撞盒，格式：{ minX, maxX, minZ, maxZ }
        const colliders = [];
        const playerRadius = 0.25; // 法斗碰撞半径（米）

        function addCollider(cx, cz, halfW, halfD, showBox = false, boxH = 1.0, boxY = 0.5, isPlatform = false) {
            colliders.push({
                minX: cx - halfW,
                maxX: cx + halfW,
                minZ: cz - halfD,
                maxZ: cz + halfD,
                platformTop: isPlatform ? boxY + boxH / 2 : -Infinity  // 平台顶部高度
            });
            // 碰撞盒可视化已禁用
            // if (showBox) { ... }
        }

        function addWall(x, z, w, d) {
            const geo = new THREE.BoxGeometry(w, wallH, d);
            const mat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.7 });
            const wall = new THREE.Mesh(geo, mat);
            wall.position.set(x, wallH / 2, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            // 同步注册碰撞体积
            addCollider(x, z, w / 2, d / 2);
            return wall;
        }

        // 四面墙壁
        addWall(0, -houseHalf, 9, wallThick);          // 前
        addWall(0, houseHalf - 1.0, 9, wallThick);     // 后（内移1单位，靠近厨房卫生间）
        addWall(-houseHalf, 0, wallThick, 9);          // 左
        addWall(houseHalf, 0, wallThick, 9);           // 右

        // ==================== 地板 ====================
        // 地板覆盖到后墙位置（Z: -4.5 ~ 3.5）
        const floorGeo = new THREE.PlaneGeometry(9, 8);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xD4A76A, roughness: 0.45, metalness: 0.03 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, 0.01, -0.5);
        floor.receiveShadow = true;
        scene.add(floor);

        // 木地板纹理线
        for (let i = -4.5; i <= 4.5; i += 0.5) {
            const lineGeo = new THREE.BoxGeometry(0.025, 0.005, 9);
            const lineMat = new THREE.MeshStandardMaterial({ color: 0xB8895A, roughness: 0.6 });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.position.set(i, 0.015, 0);
            line.receiveShadow = true;
            scene.add(line);
        }
        for (let i = -4.5; i <= 4.5; i += 0.5) {
            const lineGeo2 = new THREE.BoxGeometry(9, 0.005, 0.025);
            const lineMat = new THREE.MeshStandardMaterial({ color: 0xB8895A, roughness: 0.6 });
            const line2 = new THREE.Mesh(lineGeo2, lineMat);
            line2.position.set(0, 0.015, i);
            line2.receiveShadow = true;
            scene.add(line2);
        }

        // 卧室床碰撞体（卧室在 X=-1.65, Z=-2.0，床靠左侧墙）
        addCollider(-1.65 - 0.1, -2.0 - 1.15, 0.9, 1.0, true, 0.6, 0.3);

        // 客厅碰撞体（客厅在 X=2.5, Z=-2.0）
        addCollider(2.5 - 0.8 + 0.4 - 0.2, -2.0 + 0.675, 0.5, 0.75, true, 1.0, 0.5);

        // 客厅电视墙碰撞盒（遥控器(1.35,-1.68)正前方约1.5米的墙面）
        const tvWallX = 1.35;       // 与遥控器同X
        const tvWallZ = -3.05;      // 朝-z移0.3
        const tvWallW = 4.6;         // 墙面宽度（继续加长）
        const tvWallD = 0.12;        // 墙面厚度
        addCollider(tvWallX, tvWallZ, tvWallW / 2, tvWallD / 2, true, 1.5, 0.75);

        // 法斗区域碰撞盒（x:-0.2~+0.9, z:-2.7）
        const dogAreaCX = 0.35;     // (-0.2+0.9)/2
        const dogAreaCZ = -3.0;     // 再向-z移0.2
        addCollider(dogAreaCX, dogAreaCZ, 0.55, 0.35, true, 0.4, 0.175);

        // 卫生间抬升区域：碰撞盒已隐藏

        // 卫生间+Z侧后半区碰撞体积（Z从中点到最大值之间的一半）
        addCollider(2.5, 2.775, 1.5, 0.375, true, 1.6, 1.0);

        // 以上述碰撞体X和Z最大值点(4.0, 3.15)为轴心顺时针旋转90°得到的新碰撞体
        // 原中心(2.5,2.775) → 新中心(4.375, 1.65)，尺寸互换: 0.375×1.5
        addCollider(3.375, 1.65, 0.375, 1.5, true, 1.6, 1.0);

        // ==================== 天花板 ====================
        const ceilGeo = new THREE.PlaneGeometry(9, 9);
        const ceilMat = new THREE.MeshStandardMaterial({ color: 0xF5F0E8, roughness: 0.7, side: THREE.DoubleSide });
        const ceiling = new THREE.Mesh(ceilGeo, ceilMat);
        ceiling.rotation.x = -Math.PI / 2;
        ceiling.position.set(0, wallH, 0);
        ceiling.receiveShadow = true;
        scene.add(ceiling);

        // ==================== 点光源 ====================
        const lightPositions = [
            { x: -2.2, z: -2.2 }, { x: 2.2, z: -2.2 },
            { x: -2.2, z: 2.2 },  { x: 2.2, z: 2.2 }
        ];
        lightPositions.forEach(lp => {
            const pl = new THREE.PointLight(0xfff5e6, 0.6, 7);
            pl.position.set(lp.x, 2.2, lp.z);
            scene.add(pl);
        });

        const centerLight = new THREE.PointLight(0xfffae6, 1.0, 12);
        centerLight.position.set(0, 2.5, 0);
        scene.add(centerLight);

        // ==================== 房间模型加载 ====================
        const gltfLoader = new GLTFLoader();

        // 玩具球引用（客厅加载后填充）
        let toyBallMesh = null;

        function loadObjRoom(objFile, mtlFile, scale, posX, posZ, rotY, label) {
            const mtlLoader = new MTLLoader();
            mtlLoader.load(mtlFile, (materials) => {
                materials.preload();
                const objLoader = new OBJLoader();
                objLoader.setMaterials(materials);
                objLoader.load(objFile, (room) => {
                    room.scale.set(scale, scale, scale);
                    room.position.set(posX, 0, posZ);
                    room.rotation.y = rotY;
                    room.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            // 查找玩具球：名称为"球体.019"的mesh
                            if (label === '客厅' && child.name === '球体.019') {
                                toyBallMesh = child;
                                // 如果之前互动过，恢复发光
                                if (localStorage.getItem('toyBallInteracted') === 'true') {
                                    toyBallMesh.material = toyBallMesh.material.clone();
                                    // 发光已禁用: toyBallMesh.material.emissive = new THREE.Color(0xFFD700);
                                    // 发光已禁用: toyBallMesh.material.emissiveIntensity = 0.5;
                                }
                                console.log('🏀 玩具球已找到！', child.name);
                            }
                            // 恢复钢琴发光状态
                            if (label === '客厅' && child.material && child.material.name) {
                                const mn = child.material.name;
                                if ((mn === 'gangqing' || mn === 'gangqing2' || mn.startsWith('gangqing')) && localStorage.getItem('pianoInteracted') === 'true') {
                                    child.material = child.material.clone();
                                    // 发光已禁用: child.material.emissive = new THREE.Color(0xFFD700);
                                    // 发光已禁用: child.material.emissiveIntensity = 0.8;
                                    console.log('🎹 钢琴发光已恢复！', mn);
                                }
                            }
                        }
                    });
                    scene.add(room);
                    console.log(`✅ ${label} (OBJ) 加载成功！`);
                }, undefined, (error) => {
                    console.error(`❌ ${label} OBJ加载失败:`, error);
                });
            }, undefined, (error) => {
                console.error(`❌ ${label} MTL加载失败:`, error);
            });
        }

        function loadRoom(filename, scale, posX, posZ, rotY, label, addColl = false) {
            gltfLoader.load(filename, (gltf) => {
                const room = gltf.scene;
                room.scale.set(scale, scale, scale);
                room.position.set(posX, 0, posZ);
                room.rotation.y = rotY;
                room.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                scene.add(room);

                // 如果需要自动添加碰撞体（用于厨房桌子等）
                if (addColl) {
                    // 只计算Y>0.25m的对象（桌面和桌腿，排除地板/地毯）
                    const tableBox = new THREE.Box3();
                    room.traverse((child) => {
                        if (child.isMesh) {
                            const childBox = new THREE.Box3().setFromObject(child);
                            // 只取世界Y坐标>0.25m的部分（桌面高度）
                            if (childBox.max.y > 0.25) {
                                tableBox.union(childBox);
                            }
                        }
                    });
                    const cx = (tableBox.min.x + tableBox.max.x) / 2;
                    const cz = (tableBox.min.z + tableBox.max.z) / 2;
                    const hw = (tableBox.max.x - tableBox.min.x) / 2;
                    const hd = (tableBox.max.z - tableBox.min.z) / 2;
                    const th = tableBox.max.y - tableBox.min.y;
                    const ty = (tableBox.min.y + tableBox.max.y) / 2;
                    console.log(`📦 ${label} 碰撞体: center=(${cx.toFixed(2)}, ${cz.toFixed(2)}), size=${(hw*2).toFixed(2)}×${(hd*2).toFixed(2)}, 高=${th.toFixed(2)}`);
                    addCollider(cx, cz, hw, hd, true, th, ty);
                }

                console.log(`✅ ${label} 加载成功！`);
            }, undefined, (error) => {
                console.error(`❌ ${label} 加载失败:`, error);
            });
        }

        // 四个房间均匀分布在 9m×9m 空间内
        const spacingX = 2.5;
        const spacingZ = 2.0;
        const bedroomOffsetX = 0.85; // 卧室往客厅方向微调
        const kitchenOffsetZ = 0.5;  // 厨房往卧室方向微调
        const bathroomOffsetZ = 0.35; // 卫生间往客厅方向微调
        loadRoom('rooms/bedroom.glb',   0.5, -spacingX + bedroomOffsetX, -spacingZ, 0,              '卧室');
        loadObjRoom('rooms/livingroom.obj', 'rooms/livingroom.mtl', 0.5, spacingX, -spacingZ, -Math.PI/2, '客厅');
        loadRoom('rooms/kitchen.glb',   0.5, -spacingX,  spacingZ - kitchenOffsetZ, Math.PI/2,      '厨房', false);
        loadRoom('rooms/bathroom.glb',  0.5,  spacingX,  spacingZ - bathroomOffsetZ, Math.PI,       '卫生间');

        let swimRingMeshRef = null; // 全局引用，供发光使用

        // 识别卫生间游泳圈（Torus.005，蓝色#1F49CC+白色#CCCCCC双色条纹）
        (function identifyBathroomItems() {
            const checkBath = setInterval(() => {
                const bathroom = scene.children.find(c =>
                    c.isObject3D && !c.isLight &&
                    c.position.x > 0 && c.position.z > 0 &&
                    Math.abs(c.position.x - spacingX) < 2 &&
                    Math.abs(c.position.z - (spacingZ - bathroomOffsetZ)) < 2
                );
                if (!bathroom) return;
                clearInterval(checkBath);

                let swimRingMesh = null;
                bathroom.traverse((child) => {
                    if (child.isMesh && child.name === 'Torus.005') {
                        const mat = child.material;
                        const hex = mat && mat.color ? '#' + mat.color.getHexString() : '?';
                        console.log('🏊 卫生间Torus.005: 颜色=' + hex + ', pos=' + child.position.x.toFixed(2) + ',' + child.position.y.toFixed(2) + ',' + child.position.z.toFixed(2));
                        swimRingMesh = child;
                        swimRingMeshRef = child;
                        const wp = new THREE.Vector3();
                        child.getWorldPosition(wp);
                        swimRingWorldPos.set(wp.x, wp.y, wp.z);
                        console.log('✅ 游泳圈世界位置: ' + wp.x.toFixed(2) + ', ' + wp.y.toFixed(2) + ', ' + wp.z.toFixed(2));
                    }
                });
            }, 500);
        })();

        // 过渡墙体：厨房与卫生间之间的浅棕色连接墙
        const wallStartX = -spacingX + 1.5;
        const wallEndX = spacingX - 1.5;
        const wallCenterX = (wallStartX + wallEndX) / 2;
        const wallLength = wallEndX - wallStartX;
        const wallZ = (spacingZ - kitchenOffsetZ + spacingZ - bathroomOffsetZ) / 2 + 1.6;
        const wallGeo = new THREE.BoxGeometry(wallLength, 2.8, 0.3);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xE2A66D, roughness: 0.45, metalness: 0.03 });
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(wallCenterX, 1.4, wallZ);
        wall.castShadow = true;
        wall.receiveShadow = true;
        scene.add(wall);
        addCollider(wallCenterX, wallZ, wallLength / 2, 0.15); // 过渡墙1碰撞体积
        console.log('🧱 厨房-卫生间过渡墙已创建');

        // 过渡墙前面的装饰模型（摇篮椅）
        gltfLoader.load('models/transition_deco.glb', (gltf) => {
            const deco = gltf.scene;
            deco.scale.set(0.5, 0.5, 0.5);
            const chairPosX = wallCenterX + 0.1;   // ≈ 0.1
            const chairPosZ = wallZ + 0.95;         // ≈ 4.125
            deco.position.set(chairPosX, 0.3, chairPosZ);
            deco.rotation.y = Math.PI / 2;
            deco.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            scene.add(deco);

            // 用 Three.js 自动计算世界坐标系中的精确包围盒
            const box = new THREE.Box3().setFromObject(deco);
            const cx = (box.min.x + box.max.x) / 2;
            const cz = (box.min.z + box.max.z) / 2;
            const hw = (box.max.x - box.min.x) / 2;
            const hd = (box.max.z - box.min.z) / 2;
            console.log(`🪑 摇篮椅包围盒: center=(${cx.toFixed(2)}, ${cz.toFixed(2)}), size=${(hw*2).toFixed(2)}×${(hd*2).toFixed(2)}, Z=[${box.min.z.toFixed(2)}, ${box.max.z.toFixed(2)}]`);
            
            addCollider(cx, cz, hw, hd, true, 1.22, 0.91);
        });

        // 过渡墙2：卫生间与客厅之间
        const wall2StartZ = -spacingZ + 1.5;
        const wall2EndZ = spacingZ - bathroomOffsetZ - 1.5;
        const wall2CenterZ = (wall2StartZ + wall2EndZ) / 2;
        const wall2Length = wall2EndZ - wall2StartZ;
        const wall2X = spacingX + 1.8;
        const wall2Geo = new THREE.BoxGeometry(0.3, 2.8, wall2Length);
        const wall2Mat = new THREE.MeshStandardMaterial({ color: 0xE2A66D, roughness: 0.45, metalness: 0.03 });
        const wall2 = new THREE.Mesh(wall2Geo, wall2Mat);
        wall2.position.set(wall2X, 1.4, wall2CenterZ);
        wall2.castShadow = true;
        wall2.receiveShadow = true;
        scene.add(wall2);
        addCollider(wall2X, wall2CenterZ, 0.15, wall2Length / 2); // 过渡墙2碰撞体积
        console.log('🧱 卫生间-客厅过渡墙已创建');

        // ==================== 路径 ====================
        const pathR = 3.5;
        const pathPoints = [
            { x: -pathR, z: -pathR }, { x: 0, z: -pathR }, { x: pathR, z: -pathR },
            { x: pathR, z: 0 }, { x: pathR, z: pathR },
            { x: 0, z: pathR }, { x: -pathR, z: pathR },
            { x: -pathR, z: 0 }, { x: -pathR, z: -pathR }
        ];
        const pathMat = new THREE.MeshStandardMaterial({
            color: 0xF9E79F, roughness: 0.3, transparent: true, opacity: 0.5,
            emissive: 0xF9E79F, emissiveIntensity: 0.3
        });
        for (let i = 0; i < pathPoints.length - 1; i++) {
            const p1 = pathPoints[i], p2 = pathPoints[i + 1];
            const dx = p2.x - p1.x, dz = p2.z - p1.z;
            const dist = Math.sqrt(dx * dx + dz * dz), angle = Math.atan2(dx, dz);
            const segments = Math.floor(dist / 0.2);
            for (let s = 0; s < segments; s++) {
                if (s % 2 === 0) {
                    const t = s / segments;
                    const seg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.01, 0.12), pathMat);
                    seg.position.set(p1.x + dx * t, 0.02, p1.z + dz * t);
                    seg.rotation.y = angle;
                    scene.add(seg);
                }
            }
        }

        // ==================== 狗粮碗（摇篮椅旁边）====================
        const dogBowlGroup = new THREE.Group();

        // 碗体：不锈钢金属质感（圆柱 + 底部圆角）
        const bowlRadius = 0.25;
        const bowlHeight = 0.12;
        const bowlThickness = 0.008;
        // 外壁
        const bowlGeo = new THREE.CylinderGeometry(bowlRadius, bowlRadius * 0.65, bowlHeight, 32, 1, true);
        const bowlMat = new THREE.MeshStandardMaterial({
            color: 0xC0C0C0, metalness: 0.85, roughness: 0.2,
            side: THREE.DoubleSide
        });
        const bowlOuter = new THREE.Mesh(bowlGeo, bowlMat);
        bowlOuter.position.y = bowlHeight / 2;
        dogBowlGroup.add(bowlOuter);
        // 底部
        const bowlBottomGeo = new THREE.CircleGeometry(bowlRadius * 0.65, 32);
        const bowlBottom = new THREE.Mesh(bowlBottomGeo, bowlMat);
        bowlBottom.rotation.x = -Math.PI / 2;
        bowlBottom.position.y = 0;
        dogBowlGroup.add(bowlBottom);
        // 碗口边缘（加厚环）
        const rimGeo = new THREE.TorusGeometry(bowlRadius, bowlThickness * 1.5, 8, 32);
        const rimMat = new THREE.MeshStandardMaterial({
            color: 0xB0B0B0, metalness: 0.8, roughness: 0.25
        });
        const rim = new THREE.Mesh(rimGeo, rimMat);
        rim.rotation.x = Math.PI / 2;
        rim.position.y = bowlHeight;
        dogBowlGroup.add(rim);

        // 狗粮颗粒（棕色小圆球，堆成小山状）
        const kibbleColor = 0x8B5A2B;
        const kibbleMat = new THREE.MeshStandardMaterial({
            color: kibbleColor, roughness: 0.7, metalness: 0.02
        });
        const kibbleGeo = new THREE.SphereGeometry(0.012, 6, 5); // 小圆球
        const kibbleCount = 80; // 颗粒数量
        for (let i = 0; i < kibbleCount; i++) {
            const kibble = new THREE.Mesh(kibbleGeo, kibbleMat);
            // 圆柱坐标系随机分布，中心高边缘低（堆成山）
            const r = Math.random() * bowlRadius * 0.78;
            const theta = Math.random() * Math.PI * 2;
            // 越靠近中心越高
            const heightFactor = 1 - (r / (bowlRadius * 0.78)) * 0.85;
            const baseH = bowlHeight * 0.15 + heightFactor * (bowlHeight * 0.75);
            const jitterY = Math.random() * 0.01;
            kibble.position.set(
                r * Math.cos(theta) + (Math.random() - 0.5) * 0.03,
                baseH + jitterY,
                r * Math.sin(theta) + (Math.random() - 0.5) * 0.03
            );
            // 随机微旋转让每个颗粒看起来不同
            kibble.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );
            dogBowlGroup.add(kibble);
        }

        // 放置位置：摇篮椅右侧前方一点（摇篮椅约在 wallCenterX+0.1, wallZ+0.95）
        const bowlPosX = wallCenterX + 0.9 - 0.5 - 0.8;
        const bowlPosZ = wallZ + 0.55 - 2 + 0.5 + 0.5;
        dogBowlGroup.position.set(bowlPosX, 0, bowlPosZ);
        dogBowlGroup.traverse((child) => {
            if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
            }
        });
        scene.add(dogBowlGroup);
        console.log('🍖 狗粮碗已放置在摇篮椅旁！');

        // 如果之前互动过，恢复发光
        if (localStorage.getItem('dogBowlInteracted') === 'true') {
            dogBowlGroup.traverse((child) => {
                if (child.isMesh && child.material && child.material.color &&
                    (child.material.color.getHex() === 0xC0C0C0 || child.material.color.getHex() === 0xB0B0B0)) {
                    // 发光已禁用: child.material.emissive = new THREE.Color(0xFFE4B5);
                    // 发光已禁用: child.material.emissiveIntensity = 0.6;
                }
            });
        }

        // 狗粮碗碰撞体（小型，不阻挡移动但可交互）
        addCollider(dogBowlGroup.position.x, dogBowlGroup.position.z, 0.22, 0.22, true, 0.15, 0.075);

        // ==================== 遥控器（客厅桌子上） ====================
        const remoteGroup = new THREE.Group();
        const remotePosX = 1.35;
        const remotePosZ = -1.68;
        const remotePosY = 0.45; // 桌面高度

        // 遥控器主体：扁长方体
        const remoteBodyGeo = new THREE.BoxGeometry(0.18, 0.04, 0.06);
        const remoteBodyMat = new THREE.MeshStandardMaterial({
            color: 0x333333, metalness: 0.2, roughness: 0.5
        });
        const remoteBody = new THREE.Mesh(remoteBodyGeo, remoteBodyMat);
        remoteBody.position.y = 0;
        remoteBody.castShadow = true;
        remoteBody.receiveShadow = true;
        remoteGroup.add(remoteBody);

        // 按键：几个小凸起方块
        const btnMat = new THREE.MeshStandardMaterial({
            color: 0x888888, metalness: 0.1, roughness: 0.4
        });
        const btnSize = { w: 0.02, h: 0.006, d: 0.02 };
        // 方向键区（上方）
        const btnPositions = [
            { x: 0, z: 0.015 },          // 上
            { x: 0, z: -0.015 },         // 下
            { x: -0.015, z: 0 },         // 左
            { x: 0.015, z: 0 },          // 右
            { x: 0, z: 0 },              // 中
            // 数字键区（下方）
            { x: -0.04, z: -0.015 },     // 1
            { x: -0.02, z: -0.015 },     // 2
            { x: 0, z: -0.015 },         // 3
            { x: -0.04, z: 0.015 },      // 4
            { x: -0.02, z: 0.015 },      // 5
            { x: 0, z: 0.015 },          // 6
        ];
        btnPositions.forEach(bp => {
            const btnGeo = new THREE.BoxGeometry(btnSize.w, btnSize.h, btnSize.d);
            const btn = new THREE.Mesh(btnGeo, btnMat);
            btn.position.set(bp.x, 0.02 + btnSize.h / 2, bp.z);
            btn.castShadow = true;
            remoteGroup.add(btn);
        });

        function createGuideCurvePoints(from, to) {
            const points = [];
            const segments = 60;
            // 弯曲：沿水平面走弧形路线，贴地
            const dist = Math.sqrt((to.x - from.x) ** 2 + (to.z - from.z) ** 2);
            const arcOffset = dist * 0.15;
            // 水平方向偏移（产生弯弯的效果）
            const perpX = -(to.z - from.z) / (dist || 1) * arcOffset;
            const perpZ = (to.x - from.x) / (dist || 1) * arcOffset;
            const groundY = 0.05; // 贴地高度
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const x = from.x + (to.x - from.x) * t + perpX * Math.sin(t * Math.PI);
                const z = from.z + (to.z - from.z) * t + perpZ * Math.sin(t * Math.PI);
                const y = groundY;
                points.push(new THREE.Vector3(x, y, z));
            }
            return points;
        }

        function updateGuideLine() {

            const material = new THREE.LineDashedMaterial({

                linewidth: 1,
                transparent: true,
                opacity: 0.7,

                toyBallMesh.position.y = originalY + bounce;
