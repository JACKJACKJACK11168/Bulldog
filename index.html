            'F4', 'F4', 'E4', 'E4', 'D4', 'D4', 'C4',
            'G4', 'G4', 'F4', 'F4', 'E4', 'E4', 'D4',
            'G4', 'G4', 'F4', 'F4', 'E4', 'E4', 'D4'
        ];

        // 下落音符
        let fallingNotes = [];
        const FALL_SPEED = 130; // px/s
        const TRACK_Y_START = -60;
        const TRIGGER_LINE_RATIO = 0.55;

        // 动画相关
        let pianoLastTime = 0;
        let pianoAnimId = null;

        // 琴键发光效果
        let keyGlows = {};      // { keyIndex: { time, color } }
        let keyShakes = {};     // { keyIndex: time }

        function getKeyIndex(noteName) {
            return keyNames.indexOf(noteName);
        }

        function pianoNoteToFrequency(noteName) {
            return noteFrequencies[noteName] || 440;
        }

        // 播放音符音效
        function playPianoNote(noteName, duration = 0.5, volume = 0.3) {
            const freq = pianoNoteToFrequency(noteName);
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(freq * 3, now);
            filter.Q.setValueAtTime(1, now);

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + duration);

            // 叠加泛音
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(freq * 2, now);
            gain2.gain.setValueAtTime(0, now);
            gain2.gain.linearRampToValueAtTime(volume * 0.15, now + 0.01);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.6);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now);
            osc2.stop(now + duration * 0.6);
        }

        // 播放错误音效
        function playWrongNoteSound() {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.3);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.25, now + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        // 播放小星星（提示时触发）
        let twinkleTimer = null;
        function playTwinkleTwinkle() {
            if (!audioCtx || audioCtx.state === 'closed') return;
            const melody = [
                'C4','C4','G4','G4','A4','A4','G4',
                'F4','F4','E4','E4','D4','D4','C4',
            ];
            let i = 0;
            function playNext() {
                if (i >= melody.length) return;
                playPianoNote(melody[i], 0.4, 0.15);
                i++;
                twinkleTimer = setTimeout(playNext, 500);
            }
            playNext();
        }

        // 停止小星星
        function stopTwinkleTwinkle() {
            clearTimeout(twinkleTimer);
            twinkleTimer = null;
        }

        // 播放胜利旋律
        function playVictoryMelody() {
            const melody = [
                'C4','C4','G4','G4','A4','A4','G4',
                'F4','F4','E4','E4','D4','D4','C4',
                'G4','G4','F4','F4','E4','E4','D4',
                'G4','G4','F4','F4','E4','E4','D4'
            ];
            const phraseEnds = new Set([6, 13, 20]);
            let acc = 0;
            melody.forEach((note, i) => {
                if (phraseEnds.has(i - 1)) acc += 300;
                const delay = i * 380 + acc;
                setTimeout(() => playPianoNote(note, 0.6, 0.35), delay);
            });
        }

        // 调整Canvas大小
        function resizePianoCanvas() {
            pianoCanvas.width = window.innerWidth;
            pianoCanvas.height = window.innerHeight;
        }

        // 初始化游戏
        function initPianoGame() {
            pianoGameActive = true;
            pianoGameOver = false;
            pianoGameResult = null;
            pianoScore = 0;
            pianoMistakes = 0;
            fallingNotes = [];
            keyGlows = {};
            keyShakes = {};

            // 生成下落音符，小节之间插入额外间隔
            const phraseEnds = new Set([6, 13, 20]); // 每小节最后一个音符索引
            let accumulatedOffset = 0;
            melodyNotes.forEach((noteName, i) => {
                if (phraseEnds.has(i - 1)) accumulatedOffset += 120; // 小节间间隔
                const keyIndex = getKeyIndex(noteName);
                if (keyIndex >= 0) {
                    fallingNotes.push({
                        keyIndex: keyIndex,
                        noteName: noteName,
                        y: TRACK_Y_START - (i * 90 + accumulatedOffset),
                        active: true,
                        hit: false,
                        missed: false
                    });
                }
            });

            pianoScoreEl.textContent = '';
            pianoMistakesEl.textContent = '';
            pianoResultEl.style.display = 'none';

            resizePianoCanvas();
            pianoOverlay.style.display = 'block';
            pianoLastTime = performance.now();

            // 隐藏3D场景UI
            hintEl.classList.remove('visible');
            document.getElementById('controls-hint').style.opacity = '0';
            document.getElementById('pos-display').style.opacity = '0';

            // 禁用3D场景交互
            renderer.domElement.style.pointerEvents = 'none';

            if (pianoAnimId) cancelAnimationFrame(pianoAnimId);
            pianoAnimId = requestAnimationFrame(pianoGameLoop);
        }

        // 退出游戏
        function exitPianoGame() {
            pianoGameActive = false;
            pianoGameOver = false;
            if (pianoAnimId) cancelAnimationFrame(pianoAnimId);
            pianoAnimId = null;
            pianoOverlay.style.display = 'none';
            renderer.domElement.style.pointerEvents = '';
            document.getElementById('controls-hint').style.opacity = '';
            document.getElementById('pos-display').style.opacity = '';
        }

        // 点击琴键处理
        function handlePianoClick(mx, my) {
            if (!pianoGameActive || pianoGameOver) return;

            const w = pianoCanvas.width;
            const h = pianoCanvas.height;
            const keyAreaTop = h * 0.40;
            const keyAreaBottom = h * 0.80;
            const keyWidth = w * 0.85 / WHITE_KEYS;
            const keyAreaLeft = (w - keyWidth * WHITE_KEYS) / 2;

            if (my < keyAreaTop || my > keyAreaBottom) return;
            const relX = mx - keyAreaLeft;
            if (relX < 0 || relX > keyWidth * WHITE_KEYS) return;

            const clickedKey = Math.floor(relX / keyWidth);
            const triggerY = h * TRIGGER_LINE_RATIO;

            // 找最近的未命中音符（触发线±30px内判定）
            let bestNote = null;
            let bestDist = Infinity;
            for (const note of fallingNotes) {
                if (!note.active || note.hit || note.missed) continue;
                if (note.keyIndex !== clickedKey) continue;
                const dist = note.y - triggerY;
                const absDist = Math.abs(dist);
                // 允许在触发线上方20px到下方30px范围内
                if (dist <= 30 && dist >= -20 && absDist < bestDist) {
                    bestDist = absDist;
                    bestNote = note;
                }
            }

            if (bestNote) {
                // 正确！
                bestNote.hit = true;
                bestNote.active = false;
                pianoScore++;
                keyGlows[clickedKey] = { time: 0.4, color: '#FFD700' };
                playPianoNote(bestNote.noteName, 0.5, 0.3);
                pianoScoreEl.textContent = `✦ ${pianoScore} / ${melodyNotes.length}`;

                // 首次命中后隐藏提示
                const hintEl2 = document.getElementById('piano-hint');
                if (hintEl2 && pianoScore === 1) {
                    hintEl2.style.opacity = '0';
                }

                // 检查是否完成
                checkPianoComplete();
            } else {
                // 检查该轨道是否还有未处理的光点，没有则不判错（避免延迟/重复点击误判）
                const hasActiveOnTrack = fallingNotes.some(n => n.active && !n.hit && !n.missed && n.keyIndex === clickedKey);
                if (hasActiveOnTrack) {
                    // 错误：按错键（该轨道有活跃光点但不在判定范围内）
                    pianoMistakes++;
                    keyGlows[clickedKey] = { time: 0.3, color: '#FF4444' };
                    keyShakes[clickedKey] = 0.3;
                    playWrongNoteSound();
                    pianoMistakesEl.textContent = `错误: ${'✖'.repeat(pianoMistakes)}`;

                    // 把该轨道最近的活跃光点标记掉，避免走到底部重复判错
                    let closestNote = null;
                    let closestDist = Infinity;
                    for (const note of fallingNotes) {
                        if (!note.active || note.hit || note.missed) continue;
                        if (note.keyIndex !== clickedKey) continue;
                        const d = Math.abs(note.y - triggerY);
                        if (d < closestDist) { closestDist = d; closestNote = note; }
                    }
                    if (closestNote) {
                        closestNote.missed = true;
                        closestNote.active = false;
                    }

                    checkPianoFail();
                    checkPianoComplete();
                }
            }
        }

        // 检查是否完成
        function checkPianoComplete() {
            const allDone = fallingNotes.every(n => n.hit || n.missed);
            if (allDone && pianoMistakes < pianoMaxMistakes) {
                endPianoGame('win');
            }
        }

        // 检查是否失败
        function checkPianoFail() {
            if (pianoMistakes >= pianoMaxMistakes) {
                endPianoGame('lose');
            }
        }

        // 结束游戏
        function endPianoGame(result) {
            pianoGameOver = true;
            pianoGameResult = result;
            pianoResultEl.style.display = 'block';

            if (result === 'win') {
                pianoResultText.innerHTML = '…主人教我的第一首曲子，<br>我还记得。';
                playVictoryMelody();
                makePianoGlow(true);
                // 只有胜利才永久锁定
                if (!pianoInteracted) {
                    pianoInteracted = true;
                    localStorage.setItem('pianoInteracted', 'true');
                }
            } else {
                pianoResultText.innerHTML = '…有些旋律，<br>再也接不上了。';
                makePianoGlow(false);
            }

            // 点击任意位置：胜利退出，失败重试
            const exitHandler = () => {
                if (result === 'win') {
                    exitPianoGame();
                } else {
                    initPianoGame();
                }
                pianoOverlay.removeEventListener('click', exitHandler);
                document.removeEventListener('keydown', exitHandler);
            };
            setTimeout(() => {
                pianoOverlay.addEventListener('click', exitHandler);
                document.addEventListener('keydown', exitHandler);
            }, 500);
        }

        // 让3D场景中钢琴模型发光/变暗
        function makePianoGlow(success) {
            scene.traverse((child) => {
                if (child.isMesh && child.material) {
                    const matName = child.material.name || '';
                    // OBJ加载的材质可能带"_0"后缀
                    if (matName && (matName === 'gangqing' || matName === 'gangqing2' || matName.startsWith('gangqing'))) {
                        if (success) {
                            child.material = child.material.clone();
                            // 发光已禁用: child.material.emissive = new THREE.Color(0xFFD700);
                            // 发光已禁用: child.material.emissiveIntensity = 0.8;
                        } else {
                            child.material = child.material.clone();
                            // 发光已禁用: child.material.emissive = new THREE.Color(0x222222);
                            // 发光已禁用: child.material.emissiveIntensity = 0.1;
                        }
                    }
                }
            });
        }

        // 更新音符
        function updateFallingNotes(dt) {
            if (pianoGameOver) return;
            const h = pianoCanvas.height;
            const triggerY = h * TRIGGER_LINE_RATIO;

            for (const note of fallingNotes) {
                if (!note.active || note.hit) continue;
                note.y += FALL_SPEED * dt;

                // 超出底部
                if (note.y > h + 50 && !note.missed) {
                    note.missed = true;
                    note.active = false;
                    pianoMistakes++;
                    keyGlows[note.keyIndex] = { time: 0.3, color: '#FF4444' };
                    playWrongNoteSound();
                    pianoMistakesEl.textContent = `错误: ${'✖'.repeat(pianoMistakes)}`;
                    checkPianoFail();
                    checkPianoComplete();
                }
            }

            // 更新特效计时器
            const deltaTime = dt;
            for (const k in keyGlows) {
                keyGlows[k].time -= deltaTime;
                if (keyGlows[k].time <= 0) delete keyGlows[k];
            }
            for (const k in keyShakes) {
                keyShakes[k] -= deltaTime;
                if (keyShakes[k] <= 0) delete keyShakes[k];
            }
        }

        // 渲染
        function renderPianoGame() {
            const w = pianoCanvas.width;
            const h = pianoCanvas.height;
            const ctx = pianoCtx;

            ctx.clearRect(0, 0, w, h);

            // 背景渐变
            const bgGrad = ctx.createRadialGradient(w / 2, h * 0.4, 50, w / 2, h * 0.4, Math.max(w, h));
            bgGrad.addColorStop(0, '#1a1a2e');
            bgGrad.addColorStop(1, '#0a0a15');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            // 粒子背景
            const particleCount = 60;
            for (let i = 0; i < particleCount; i++) {
                const px = (Math.sin(i * 73.7 + performance.now() * 0.0003 + i) * 0.5 + 0.5) * w;
                const py = (Math.cos(i * 47.3 + performance.now() * 0.0005 + i) * 0.5 + 0.5) * h;
                ctx.fillStyle = `rgba(255, 255, 255, ${0.03 + Math.sin(performance.now() * 0.002 + i) * 0.02})`;
                ctx.beginPath();
                ctx.arc(px, py, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // 触发线
            const triggerY = h * TRIGGER_LINE_RATIO;
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, triggerY);
            ctx.lineTo(w, triggerY);
            ctx.stroke();
            ctx.setLineDash([]);

            // 轨道区域
            const keyAreaTop = h * 0.40;
            const keyAreaBottom = h * 0.80;
            const keyWidth = w * 0.85 / WHITE_KEYS;
            const keyAreaLeft = (w - keyWidth * WHITE_KEYS) / 2;

            // 轨道竖线
            for (let i = 0; i <= WHITE_KEYS; i++) {
                const x = keyAreaLeft + i * keyWidth;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, keyAreaTop);
                ctx.stroke();
            }

            // 琴键（先绘制，在光点后面）
            const keyHeight = keyAreaBottom - keyAreaTop;
            for (let i = 0; i < WHITE_KEYS; i++) {
                const kx = keyAreaLeft + i * keyWidth;
                const ky = keyAreaTop;

                // 琴键主体
                let keyColor;
                let shakeOffsetX = 0;
                if (keyGlows[i]) {
                    const glowAlpha = Math.min(1, keyGlows[i].time / 0.3);
                    keyColor = keyGlows[i].color === '#FFD700'
                        ? `rgba(255, 215, 0, ${0.3 + glowAlpha * 0.7})`
                        : `rgba(255, 68, 68, ${0.3 + glowAlpha * 0.7})`;
                } else {
                    keyColor = 'rgba(255, 255, 255, 0.95)';
                }

                if (keyShakes[i] && keyShakes[i] > 0) {
                    shakeOffsetX = Math.sin(performance.now() * 0.05) * 4 * (keyShakes[i] / 0.3);
                }

                // 琴键阴影
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.fillRect(kx + 2 + shakeOffsetX, ky + 3, keyWidth - 2, keyHeight - 2);

                // 琴键主体
                const keyGrad = ctx.createLinearGradient(kx, ky, kx, ky + keyHeight);
                if (keyGlows[i]) {
                    const glowColor = keyGlows[i].color === '#FFD700'
                        ? ['rgba(255,240,200,1)', 'rgba(255,220,150,1)', 'rgba(255,200,100,0.95)']
                        : ['rgba(255,200,200,1)', 'rgba(255,120,120,1)', 'rgba(200,80,80,0.95)'];
                    keyGrad.addColorStop(0, glowColor[0]);
                    keyGrad.addColorStop(0.5, glowColor[1]);
                    keyGrad.addColorStop(1, glowColor[2]);
                } else {
                    keyGrad.addColorStop(0, '#FFFFFF');
                    keyGrad.addColorStop(0.5, '#F5F5F5');
                    keyGrad.addColorStop(1, '#E0E0E0');
                }
                ctx.fillStyle = keyGrad;
                roundRect(ctx, kx + 1 + shakeOffsetX, ky, keyWidth - 2, keyHeight, 6);
                ctx.fill();

                // 琴键边框
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
                ctx.lineWidth = 1;
                roundRect(ctx, kx + 1 + shakeOffsetX, ky, keyWidth - 2, keyHeight, 6);
                ctx.stroke();

                // 黑键分隔线
                if (i < WHITE_KEYS - 1 && i !== 2 && i !== 6) {
                    const sepX = kx + keyWidth + shakeOffsetX;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                    ctx.fillRect(sepX - 1, ky, 2, keyHeight * 0.6);
                }

                // 键名标注
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.font = `${Math.min(16, keyWidth * 0.55)}px 'Microsoft YaHei', sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(keyNames[i], kx + keyWidth / 2 + shakeOffsetX, ky + keyHeight - 10);
            }

            // 触发线高亮区域（在光点之下）
            const hlGrad = ctx.createLinearGradient(0, triggerY - 15, 0, triggerY + 15);
            hlGrad.addColorStop(0, 'rgba(255, 215, 0, 0)');
            hlGrad.addColorStop(0.5, 'rgba(255, 215, 0, 0.06)');
            hlGrad.addColorStop(1, 'rgba(255, 215, 0, 0)');
            ctx.fillStyle = hlGrad;
            ctx.fillRect(0, triggerY - 15, w, 30);

            // 下落音符光点（最上层，在琴键和触发线之上）
            for (const note of fallingNotes) {
                if (!note.active || note.hit) continue;
                const noteX = keyAreaLeft + note.keyIndex * keyWidth + keyWidth / 2;
                const noteY = note.y;

                // 光晕
                const glowGrad = ctx.createRadialGradient(noteX, noteY, 4, noteX, noteY, 22);
                glowGrad.addColorStop(0, 'rgba(255, 220, 100, 0.9)');
                glowGrad.addColorStop(0.3, 'rgba(255, 200, 60, 0.5)');
                glowGrad.addColorStop(0.7, 'rgba(255, 150, 30, 0.1)');
                glowGrad.addColorStop(1, 'rgba(255, 100, 0, 0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(noteX, noteY, 22, 0, Math.PI * 2);
                ctx.fill();

                // 主光点
                const mainGrad = ctx.createRadialGradient(noteX - 2, noteY - 2, 2, noteX, noteY, 10);
                mainGrad.addColorStop(0, '#FFFFFF');
                mainGrad.addColorStop(0.4, '#FFE066');
                mainGrad.addColorStop(1, '#FF8C00');
                ctx.fillStyle = mainGrad;
                ctx.beginPath();
                ctx.arc(noteX, noteY, 10, 0, Math.PI * 2);
                ctx.fill();

                // 尾巴
                const tailGrad = ctx.createLinearGradient(noteX, noteY, noteX, noteY - 40);
                tailGrad.addColorStop(0, 'rgba(255, 200, 60, 0.6)');
                tailGrad.addColorStop(1, 'rgba(255, 200, 60, 0)');
                ctx.fillStyle = tailGrad;
                ctx.beginPath();
                ctx.moveTo(noteX - 4, noteY);
                ctx.lineTo(noteX + 4, noteY);
                ctx.lineTo(noteX + 2, noteY - 40);
                ctx.lineTo(noteX - 2, noteY - 40);
                ctx.fill();
            }

            // 游戏结束遮罩
            if (pianoGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, w, h);
            }
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath();
        }

        function pianoGameLoop(timestamp) {
            if (!pianoGameActive) return;

            const dt = Math.min((timestamp - pianoLastTime) / 1000, 0.05);
            pianoLastTime = timestamp;

            updateFallingNotes(dt);
            renderPianoGame();

            pianoAnimId = requestAnimationFrame(pianoGameLoop);
        }

        // Canvas点击事件
        pianoCanvas.addEventListener('click', (e) => {
            if (pianoGameOver) return;
            const rect = pianoCanvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            handlePianoClick(mx, my);
        });

        // 窗口大小变化
        window.addEventListener('resize', () => {
            if (pianoGameActive) resizePianoCanvas();
        });

        // 钢琴跳过
        window.skipPiano = function() {
            if (pianoGameOver) return;
            pianoScore = melodyNotes.length;
            pianoScoreEl.textContent = '✦ ' + pianoScore + ' / ' + melodyNotes.length;
            endPianoGame('win');
        };

        // 触发钢琴游戏
        function triggerPianoGame() {
            if (pianoGameActive) return;
            stopTwinkleTwinkle();
            narrativeEl.style.opacity = '0';
            // 如果之前已经成功玩过，仍然可以再次进入
            initPianoGame();
        }

        function checkInteraction() {
            const playerPos = bulldogGroup.position;
            let closestDist = Infinity, closestItem = null;

            // 只有当前解锁的物品可交互
            if (unlockStep < UNLOCK_ORDER.length) {
                const item = UNLOCK_ORDER[unlockStep];
                if (item.worldPos) {
                    const d = playerPos.distanceTo(item.worldPos);
                    const range = 1.0;
                    if (d < range && d < closestDist) {
                        closestDist = d;
                        closestItem = {
                            id: item.id,
                            name: item.name,
                            action: () => {
                                if (ACTIONS[item.id]) {
                                    // 清除当前提示词
                                    narrativeEl.style.opacity = '0';
                                    clearTimeout(narrativeTimer);
                                    updateUnlockStep(unlockStep + 1);
                                    progressEl.textContent = '记忆碎片：' + unlockStep + '/' + UNLOCK_ORDER.length;
                                    progressEl.style.display = 'block';
                                    ACTIONS[item.id]();
                                    // 非跳转类：5秒后显示提示（项圈除外，由视频结束后的闪回控制）
                                    if (!item.id.match(/swimring|toyball|collar/)) {
                                        const done = UNLOCK_ORDER[unlockStep - 1];
                                        if (done && done.hint) {
                                            const isPiano = done.hint === '脑海中出现了熟悉的旋律';
                                            setTimeout(function(){
                                                if (isPiano) playTwinkleTwinkle();
                                                showNarrative(done.hint, isPiano ? 15000 : 5000);
                                            }, 5000);
                                        }
                                    }
                                }
                            }
                        };
                    }
                }
            }

            if (closestItem) {
                hintEl.textContent = '按 E 键 ' + closestItem.name;
                hintEl.classList.add('visible');
                return closestItem;
            } else {
                hintEl.classList.remove('visible');
                return null;
            }
        }

        // ==================== 重新开始按钮 ====================
        document.getElementById('reset-btn').addEventListener('click', () => {
            localStorage.clear();
            sessionStorage.clear();
            location.reload();
        });

        // ==================== 提示灯泡按钮 ====================
        let hintBulbTimer = null;
        let hintBulbGuideTimer = null;
        const hintBulbBtn = document.getElementById('hint-bulb-btn');
        const hintBulbGuide = document.getElementById('hint-bulb-guide');
        hintBulbBtn.addEventListener('click', () => {
            clearTimeout(hintBulbTimer);
            clearTimeout(hintBulbGuideTimer);
            if (unlockStep >= UNLOCK_ORDER.length) {
                hintBulbGuide.textContent = '全部解锁完毕！';
                guideLineGroup.visible = false;
            } else {
                const target = UNLOCK_ORDER[unlockStep];
                const itemName = target ? target.name : '';
                hintBulbGuide.innerHTML = '当前目标：<b>' + itemName + '</b><br><span style="font-size:12px;color:#aaa;">跟着金色虚线走，靠近后按 E 互动</span>';
                updateGuideLine();
                guideLineGroup.userData._lastRebuild = guideParticleTime;
                hintBulbGuideTimer = setTimeout(() => {
                    guideLineGroup.visible = false;
                    hintBulbGuide.style.opacity = '0';
                }, 2000);
            }
            hintBulbGuide.style.opacity = '1';
            hintBulbTimer = setTimeout(() => {
                hintBulbGuide.style.opacity = '0';
            }, 2500);
        });

        // 每帧自动检测提示（不依赖按键）
        let currentClosestItem = null;
        function updateInteractionHints() {
            if (pianoGameActive) return;
            currentClosestItem = checkInteraction();
        }

        // ==================== 第三人称控制 ====================
        const keyState = { w: false, a: false, s: false, d: false, space: false };
        const moveSpeed = 2.0;
        const playerDir = new THREE.Vector3();

        // ==================== 跳跃系统 ====================
        let velocityY = 0;
        const gravity = -12;
        const jumpForce = 4.5;
        const groundY = 0;      // 地面高度
        let isOnGround = true;

        let cameraYaw = Math.PI;
        let cameraPitch = 0.55;
        let cameraDistance = 3.5;
        const minDist = 2.0;
        const maxDist = 3.5;
        const mouseSensitivity = 0.004;
        let isMouseDown = false;
        let isRightDown = false;

        let smoothYaw = cameraYaw;
        let smoothPitch = cameraPitch;
        let smoothDist = cameraDistance;
        const smoothFactor = 0.12;

        let lastMouseX = 0, lastMouseY = 0;
        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isMouseDown = true;
                lastMouseX = e.pageX;
                lastMouseY = e.pageY;
            }
            if (e.button === 2) {
                isRightDown = true;
                lastMouseX = e.pageX;
                lastMouseY = e.pageY;
            }
        });
        renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('mouseup', () => { isMouseDown = false; isRightDown = false; });
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown && !isRightDown) return;
            const dx = e.pageX - lastMouseX;
            const dy = e.pageY - lastMouseY;
            lastMouseX = e.pageX;
            lastMouseY = e.pageY;

            if (isMouseDown) {
                cameraYaw -= dx * mouseSensitivity;
                cameraPitch -= dy * mouseSensitivity;
                cameraPitch = Math.max(0.15, Math.min(Math.PI / 2 - 0.1, cameraPitch));
            }
            if (isRightDown) {
                cameraDistance += dy * 0.01;
                cameraDistance = Math.max(minDist, Math.min(maxDist, cameraDistance));
            }
        });

        renderer.domElement.addEventListener('wheel', (e) => {
            cameraDistance += e.deltaY * 0.01;
            cameraDistance = Math.max(minDist, Math.min(maxDist, cameraDistance));
            e.preventDefault();
        }, { passive: false });

        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isMouseDown = true;
                lastMouseX = e.touches[0].pageX;
                lastMouseY = e.touches[0].pageY;
            }
            if (e.touches.length === 2) {
                isMouseDown = false;
                const dx = e.touches[0].pageX - e.touches[1].pageX;
                const dy = e.touches[0].pageY - e.touches[1].pageY;
                lastMouseX = Math.sqrt(dx * dx + dy * dy);
            }
        });
        window.addEventListener('touchend', () => { isMouseDown = false; });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isMouseDown) {
                const dx = e.touches[0].pageX - lastMouseX;
                const dy = e.touches[0].pageY - lastMouseY;
                lastMouseX = e.touches[0].pageX;
                lastMouseY = e.touches[0].pageY;
                cameraYaw -= dx * mouseSensitivity;
                cameraPitch -= dy * mouseSensitivity;
                cameraPitch = Math.max(0.15, Math.min(Math.PI / 2 - 0.1, cameraPitch));
            }
            if (e.touches.length === 2) {
                const dx = e.touches[0].pageX - e.touches[1].pageX;
                const dy = e.touches[0].pageY - e.touches[1].pageY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                cameraDistance -= (dist - lastMouseX) * 0.02;
                cameraDistance = Math.max(minDist, Math.min(maxDist, cameraDistance));
                lastMouseX = dist;
            }
        });

        document.addEventListener('keydown', (e) => {
            // 遥控器叼取序列中屏蔽所有按键
            if (remoteSeqLocked) return;
            // 项圈选择面板或视频播放中屏蔽所有游戏按键
            if (collarChoiceOverlay.style.display === 'flex' || collarVideoOverlay.style.display === 'block') {
                return;
            }
            // 钢琴游戏中屏蔽移动键和E键
            if (pianoGameActive) {
                if (e.code === 'KeyE') e.preventDefault();
                return;
            }
            switch (e.code) {
                case 'KeyW': keyState.w = true; e.preventDefault(); break;
                case 'KeyA': keyState.a = true; e.preventDefault(); break;
                case 'KeyS': keyState.s = true; e.preventDefault(); break;
                case 'KeyD': keyState.d = true; e.preventDefault(); break;
                case 'Space':
                    if (isOnGround) {
                        velocityY = jumpForce;
                        isOnGround = false;
                    }
                    e.preventDefault();
                    break;
                case 'KeyE':
                    if (currentClosestItem) currentClosestItem.action();
                    e.preventDefault();
                    break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': keyState.w = false; e.preventDefault(); break;
                case 'KeyA': keyState.a = false; e.preventDefault(); break;
                case 'KeyS': keyState.s = false; e.preventDefault(); break;
                case 'KeyD': keyState.d = false; e.preventDefault(); break;
            }
        });

        // 检测点 (px, pz) 与某个 collider 是否重叠（含玩家半径）
        function resolveColliders(px, pz) {
            let rx = px, rz = pz;
            for (const c of colliders) {
                const expandedMinX = c.minX - playerRadius;
                const expandedMaxX = c.maxX + playerRadius;
                const expandedMinZ = c.minZ - playerRadius;
                const expandedMaxZ = c.maxZ + playerRadius;

                if (rx > expandedMinX && rx < expandedMaxX &&
                    rz > expandedMinZ && rz < expandedMaxZ) {
                    // 计算从哪个轴推出穿透量最小
                    const overlapLeft  = rx - expandedMinX;
                    const overlapRight = expandedMaxX - rx;
                    const overlapFront = rz - expandedMinZ;
                    const overlapBack  = expandedMaxZ - rz;
                    const minOverlap = Math.min(overlapLeft, overlapRight, overlapFront, overlapBack);

                    if (minOverlap === overlapLeft)       rx = expandedMinX;
                    else if (minOverlap === overlapRight) rx = expandedMaxX;
                    else if (minOverlap === overlapFront) rz = expandedMinZ;
                    else                                  rz = expandedMaxZ;
                }
            }
            return { x: rx, z: rz };
        }

        function updateMovement(dt) {
            // 项圈面板或钢琴游戏中停止移动
            if (pianoGameActive || collarChoiceOverlay.style.display === 'flex' || collarVideoOverlay.style.display === 'block') return;

            const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw)).normalize();
            const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw)).normalize();

            playerDir.set(0, 0, 0);
            if (keyState.w) playerDir.add(forward);
            if (keyState.s) playerDir.sub(forward);
            if (keyState.a) playerDir.sub(right);
            if (keyState.d) playerDir.add(right);

            if (playerDir.length() > 0) {
                playerDir.normalize();
                const move = playerDir.clone().multiplyScalar(moveSpeed * dt);

                // 先分轴移动，再各自做碰撞解算（防止角落卡死）
                let newX = bulldogGroup.position.x + move.x;
                let newZ = bulldogGroup.position.z + move.z;

                // 世界边界（四面外墙内侧）
                newX = Math.max(-4.2, Math.min(4.2, newX));
                newZ = Math.max(-4.2, Math.min(4.2, newZ));

                // 碰撞解算：先只移动 X 轴
                const afterX = resolveColliders(newX, bulldogGroup.position.z);
                newX = afterX.x;
                // 再只移动 Z 轴
                const afterZ = resolveColliders(newX, newZ);
                newZ = afterZ.z;

                bulldogGroup.position.x = newX;
                bulldogGroup.position.z = newZ;

                const targetAngle = Math.atan2(move.x, move.z);
                let angleDiff = targetAngle - bulldogGroup.rotation.y;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                bulldogGroup.rotation.y += angleDiff * Math.min(1, dt * 8);
            }

            // ---- 卫生间区域自动抬升（走到碰撞体上自动站到0.2m高）----
            const BATHROOM_RISE_Y = 0.2;
            const bathroomCX = 2.5, bathroomCZ = 1.65, bathroomHW = 1.5, bathroomHD = 1.5;
            const inBathroomArea = bulldogGroup.position.x >= bathroomCX - bathroomHW - playerRadius &&
                                     bulldogGroup.position.x <= bathroomCX + bathroomHW + playerRadius &&
                                     bulldogGroup.position.z >= bathroomCZ - bathroomHD - playerRadius &&
                                     bulldogGroup.position.z <= bathroomCZ + bathroomHD + playerRadius;

            // ---- 跳跃 / 重力 / 平台 ----
            const prevY = bulldogGroup.position.y;
            velocityY += gravity * dt;
            bulldogGroup.position.y += velocityY * dt;
            const curY = bulldogGroup.position.y;

            const px = bulldogGroup.position.x;
            const pz = bulldogGroup.position.z;
            let landedPlatformY = -Infinity;

            for (const c of colliders) {
                if (c.platformTop > -Infinity && c.platformTop >= groundY) {
                    if (px >= c.minX - playerRadius && px <= c.maxX + playerRadius &&
                        pz >= c.minZ - playerRadius && pz <= c.maxZ + playerRadius) {
                        if (prevY >= c.platformTop && curY <= c.platformTop) {
                            landedPlatformY = Math.max(landedPlatformY, c.platformTop);
                        }
                    }
                }
            }

            if (landedPlatformY > -Infinity) {
                if (!isOnGround) playLandSound();
                bulldogGroup.position.y = landedPlatformY;
                velocityY = 0;
                isOnGround = true;
            } else if (inBathroomArea && bulldogGroup.position.y < BATHROOM_RISE_Y) {
                if (!isOnGround) playLandSound();
                bulldogGroup.position.y = BATHROOM_RISE_Y;
                velocityY = 0;
                isOnGround = true;
            } else if (bulldogGroup.position.y <= groundY) {
                if (!isOnGround) playLandSound();
                bulldogGroup.position.y = groundY;
                velocityY = 0;
                isOnGround = true;
            } else {
                isOnGround = false;
            }
        }

        function updateCamera() {
            smoothYaw += (cameraYaw - smoothYaw) * smoothFactor;
            smoothPitch += (cameraPitch - smoothPitch) * smoothFactor;
            smoothDist += (cameraDistance - smoothDist) * smoothFactor;

            const target = new THREE.Vector3(
                bulldogGroup.position.x,
                bulldogGroup.position.y + 0.35,
                bulldogGroup.position.z
            );

            let camX = target.x + smoothDist * Math.sin(smoothYaw) * Math.cos(smoothPitch);
            let camY = target.y + smoothDist * Math.sin(smoothPitch);
            let camZ = target.z + smoothDist * Math.cos(smoothYaw) * Math.cos(smoothPitch);

            camX = Math.max(-4.0, Math.min(4.0, camX));
            camZ = Math.max(-4.0, Math.min(4.0, camZ));
            camY = Math.max(0.3, Math.min(4.0, camY)); // 上限提高以跟随跳跃

            camera.position.set(camX, camY, camZ);
            camera.lookAt(target);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let walkCycle = 0;
        let gameStartTime = null;
        let openingShown = false;
        let progressRestored = false;
        let gameStarted = false;

        // 点击开始按钮后启动游戏计时
        var startBtn2 = document.getElementById('start-game-btn');
        if (startBtn2) {
            startBtn2.addEventListener('click', () => {
                gameStarted = true;
                gameStartTime = performance.now() / 1000;
            });
        } else {
            gameStarted = true;
        }

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);

            if (!gameStarted) return;

            if (!gameStartTime) gameStartTime = performance.now() / 1000;
            const elapsed = performance.now() / 1000 - gameStartTime;

            // 恢复进度（仅子游戏返回时，跳转类物品提示由这里处理）
            if (!progressRestored && unlockStep > 0 && elapsed > 1) {
                progressRestored = true;
                progressEl.textContent = '记忆碎片：' + unlockStep + '/' + UNLOCK_ORDER.length;
                progressEl.style.display = 'block';
                // 指引线默认不显示，等待用户点击提示按钮
                // 只处理跳转类物品（游泳圈、玩具球），闪回类由 action 回调负责
                const lastId = UNLOCK_ORDER[unlockStep - 1].id;
                if (lastId === 'swimring' || lastId === 'toyball') {
                    const lastDone = UNLOCK_ORDER[unlockStep - 1];
                    if (lastDone && lastDone.hint) {
                        const isPiano = lastDone.hint === '脑海中出现了熟悉的旋律';
                        setTimeout(function(){
                            if (isPiano) playTwinkleTwinkle();
                            showNarrative(lastDone.hint, isPiano ? 15000 : 4000);
                        }, 2000);
                    }
                }
            }

            // 开局提示（仅首次无进度时显示）
            if (!openingShown && unlockStep === 0) {
                if (elapsed < 5) {
                    narrativeEl.style.opacity = '1';
                    narrativeEl.textContent = '……肚子好饿。去找点吃的。';
                }
                if (elapsed > 5) {
                    narrativeEl.style.opacity = '0';
                }
                if (elapsed > 5.5) {
                    openingShown = true;
                    // 指引线默认不显示，等待用户点击提示按钮
                    updateUnlockStep(0);
                }
            }

            if (remoteSeqLocked) {
                // 序列控制期间跳过手动移动
                updateRemoteSequence(dt);
            } else {
                updateMovement(dt);
            }
            updateCamera();
            updateInteractionHints();

            // ===== 金色虚线指引更新（只在可见时才更新） =====
            if (guideLineGroup.visible) {
                guideParticleTime += dt;
                if (guideLineGroup.userData.particle && guideLineGroup.userData.curve) {
                    const t = (guideParticleTime * 0.6) % 1;
                    const pos = guideLineGroup.userData.curve.getPointAt(t);
                    guideLineGroup.userData.particle.position.copy(pos);
                    const pulse = 1 + Math.sin(guideParticleTime * 4) * 0.3;
                    guideLineGroup.userData.particle.scale.setScalar(pulse);
                    guideLineGroup.children[0].material.opacity = 0.45 + Math.sin(guideParticleTime * 3) * 0.25;
                }
                // 每1秒重建一次虚线
                if (!guideLineGroup.userData._lastRebuild || guideParticleTime - guideLineGroup.userData._lastRebuild > 1.0) {
                    updateGuideLine();
                    guideLineGroup.userData._lastRebuild = guideParticleTime;
                }
            }

            // 实时位置显示
            const posEl = document.getElementById('pos-display');
            if (posEl) {
                const p = bulldogGroup.position;
                posEl.textContent = `X: ${p.x.toFixed(2)}  Z: ${p.z.toFixed(2)}  Y: ${p.y.toFixed(2)}`;
            }

            const time = Date.now() * 0.001;
            const isMoving = keyState.w || keyState.a || keyState.s || keyState.d;

            if (bulldogGroup.children.length > 0 && bulldogGroup.children[0]) {
                const model = bulldogGroup.children[0];
                const modelBaseY = 0.28; // 模型相对于 bulldogGroup 的基础 Y

                if (!isOnGround) {
                    // 空中：通过 bulldogGroup 做轻微拉伸，不碰 model.scale
                    model.position.y = modelBaseY;
                    model.rotation.x = 0;
                    model.rotation.z = 0;
                    const stretchY = velocityY > 0 ? 1.08 : 0.92;
                    bulldogGroup.scale.set(1 / stretchY, stretchY, 1 / stretchY);
                } else if (isMoving) {
                    const prevSin = Math.sin(walkCycle);
                    walkCycle += dt * 8;
                    const curSin = Math.sin(walkCycle);
                    // 正弦波过零点触发脚步声
                    if ((prevSin <= 0 && curSin > 0) || (prevSin >= 0 && curSin < 0)) {
                        playFootstep();
                    }
                    const bounce = Math.abs(curSin) * 0.03;
                    model.position.y = modelBaseY + bounce;
                    bulldogGroup.scale.set(1, 1, 1);
                    model.rotation.x = curSin * 0.08;
                    model.rotation.z = Math.sin(walkCycle * 2) * 0.04;
                } else {
                    model.position.y += (modelBaseY - model.position.y) * 0.1;
                    model.rotation.x += (0 - model.rotation.x) * 0.1;
                    model.rotation.z += (0 - model.rotation.z) * 0.1;
                    walkCycle = 0;
                    const breathe = 1 + Math.sin(time * 3) * 0.015;
                    bulldogGroup.scale.set(breathe, breathe, breathe);
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        console.log('🐶 小八的家已加载！第三人称视角 | WASD移动 | 鼠标拖动旋转 | 滚轮缩放 | E键互动');
    </script>
</body>
</html>
