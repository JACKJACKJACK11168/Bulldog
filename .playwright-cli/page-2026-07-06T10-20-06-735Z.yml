  - text: "// ==================== 相机控制（第三人称跟随） ==================== let cameraYaw = -Math.PI / 3; let cameraPitch = 0.55; let cameraDistance = 6; const minDist = 3, maxDist = 10, mouseSensitivity = 0.004; let isMouseDown = false, isRightDown = false, lastMouseX = 0, lastMouseY = 0; const smoothFactor = 0.12; let smoothYaw = cameraYaw, smoothPitch = cameraPitch, smoothDist = cameraDistance; renderer.domElement.addEventListener('mousedown', (e) => { if (e.button === 0) { isMouseDown = true; lastMouseX = e.pageX; lastMouseY = e.pageY; } if (e.button === 2) { isRightDown = true; lastMouseX = e.pageX; lastMouseY = e.pageY; } }); renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault()); window.addEventListener('mouseup', () => { isMouseDown = false; isRightDown = false; }); window.addEventListener('mousemove', (e) => { if (!isMouseDown && !isRightDown) return; const dx = e.pageX - lastMouseX, dy = e.pageY - lastMouseY; lastMouseX = e.pageX; lastMouseY = e.pageY; if (isMouseDown) { cameraYaw -= dx * mouseSensitivity; cameraPitch -= dy * mouseSensitivity; cameraPitch = Math.max(0.15, Math.min(Math.PI / 2 - 0.1, cameraPitch)); } if (isRightDown) { cameraDistance += dy * 0.01; cameraDistance = Math.max(minDist, Math.min(maxDist, cameraDistance)); } }); renderer.domElement.addEventListener('wheel', (e) => { cameraDistance += e.deltaY * 0.01; cameraDistance = Math.max(minDist, Math.min(maxDist, cameraDistance)); e.preventDefault(); }, { passive: false }); function updateCamera() { smoothYaw += (cameraYaw - smoothYaw) * smoothFactor; smoothPitch += (cameraPitch - smoothPitch) * smoothFactor; smoothDist += (cameraDistance - smoothDist) * smoothFactor; const target = new THREE.Vector3(dogGroup.position.x, dogGroup.position.y + 0.5, dogGroup.position.z); const cx = target.x + smoothDist * Math.sin(smoothYaw) * Math.cos(smoothPitch); const cy = target.y + smoothDist * Math.sin(smoothPitch); const cz = target.z + smoothDist * Math.cos(smoothYaw) * Math.cos(smoothPitch); camera.position.set(cx, Math.max(1, cy), cz); camera.lookAt(target); } // ==================== WASD 控制法斗移动 ==================== const keyState = { w: false, a: false, s: false, d: false }; window.addEventListener('keydown', (e) => { const key = e.key.toLowerCase(); if (key in keyState) { keyState[key] = true; e.preventDefault(); // 如果游戏还没开始，自动开始 if (gameState.phase === 'idle') { startGame(); } } }); window.addEventListener('keyup', (e) => { const key = e.key.toLowerCase(); if (key in keyState) { keyState[key] = false; e.preventDefault(); } }); // ==================== 游戏逻辑 ==================== const speechBubbleEl = document.getElementById('speech-bubble'); const scoreDisplay = document.getElementById('score-display'); const bestDisplay = document.getElementById('best-display'); const scoreBox = document.getElementById('score-box'); let speechTimer = 0; function showSpeech(text, duration = 2000) { speechBubbleEl.textContent = text; speechBubbleEl.classList.add('show'); speechTimer = duration; updateSpeechPosition(); } function updateSpeechPosition() { // 将主人头顶的3D坐标投影到屏幕 const headPos = new THREE.Vector3(0, 2.15, 0); ownerGroup.localToWorld(headPos); headPos.project(camera); const x = (headPos.x * 0.5 + 0.5) * window.innerWidth; const y = (-headPos.y * 0.5 + 0.5) * window.innerHeight; speechBubbleEl.style.left = x + 'px'; speechBubbleEl.style.top = y + 'px'; speechBubbleEl.style.transform = 'translate(-50%, -100%)'; } function hideSpeech() { speechBubbleEl.classList.remove('show'); } function updateScore() { scoreDisplay.textContent = `${gameState.score} / 5`; if (gameState.score >= 5) { scoreBox.classList.add('success'); } else { scoreBox.classList.remove('success'); } if (gameState.score > gameState.bestScore) { gameState.bestScore = gameState.score; } bestDisplay.textContent = gameState.bestScore; } function startGame() { gameState.score = 0; gameState.phase = 'ownerThrow'; gameState.canInteract = true; updateScore(); scoreBox.classList.remove('success'); showSpeech('接住球！WASD控制小八去接球！', 3000); ownerThrowBall(); } function ownerThrowBall() { if (gameState.phase !== 'ownerThrow') return; gameState.canInteract = true; // 主人投球到花园中随机位置 const angle = Math.random() * Math.PI * 2; const dist = 2 + Math.random() * 3; const tx = Math.cos(angle) * dist; const tz = Math.sin(angle) * dist; gameState.ownerThrowTarget.set(tx, 0, tz); // 动画：球从主人手中飞出 const ballData = ballGroup.userData; const ownerHandPos = new THREE.Vector3(); rightHand.getWorldPosition(ownerHandPos); // rightHand 仍然在 rightUpperArm 下 ballData.startPos.copy(ownerHandPos); ballData.targetPos.set(tx, 0, tz); ballData.flyTime = 0; ballData.flyDuration = 1.2; ballData.isFlying = true; ballData.isHeldByOwner = false; // 主人投球动画 animateOwnerThrow(); showSpeech('小八，接住！', 1500); // 设置超时：如果狗没接到 setTimeout(() => { if (gameState.phase === 'ownerThrow') { // 球落地 ballData.isFlying = false; ballGroup.position.set(tx, 0.2, tz); showSpeech('球掉了，快去捡回来！', 2000); } }, 2000); } function animateOwnerThrow() { const startTime = performance.now(); const duration = 700; const origShoulderZ = rightShoulder.rotation.z; const origShoulderX = rightShoulder.rotation.x; const origArmZ = rightUpperArm.rotation.z; const origBodyX = ownerBody.rotation.x; function animStep(now) { const elapsed = now - startTime; const t = Math.min(elapsed / duration, 1.0); if (t < 0.35) { // 阶段1: 手臂向后蓄力 + 身体微微后仰 const ease = t / 0.35; const s = Math.sin(ease * Math.PI * 0.5); rightShoulder.rotation.x = origShoulderX - s * 1.2; // 肩膀后转 rightShoulder.rotation.z = origShoulderZ + s * 0.3; rightUpperArm.rotation.z = origArmZ - s * 0.6; // 小臂弯曲 ownerBody.rotation.x = origBodyX - s * 0.15; // 身体后仰 } else if (t < 0.65) { // 阶段2: 快速前甩投球 const ease = (t - 0.35) / 0.3; const s = 1 - Math.cos(ease * Math.PI * 0.5); // 快速加速 rightShoulder.rotation.x = origShoulderX - 1.2 + s * 2.8; // 肩膀前转 rightShoulder.rotation.z = origShoulderZ + 0.3 - s * 0.8; rightUpperArm.rotation.z = origArmZ - 0.6 + s * 1.8; // 小臂甩出 ownerBody.rotation.x = origBodyX - 0.15 + s * 0.3; // 身体前倾 } else { // 阶段3: 自然回位 const ease = (t - 0.65) / 0.35; const s = 1 - Math.pow(1 - ease, 2); rightShoulder.rotation.x = origShoulderX + 1.6 * (1 - s); rightShoulder.rotation.z = origShoulderZ - 0.5 * (1 - s); rightUpperArm.rotation.z = origArmZ + 1.2 * (1 - s); ownerBody.rotation.x = origBodyX + 0.15 * (1 - s); } if (t < 1.0) { requestAnimationFrame(animStep); } else { // 确保回到原始位置 rightShoulder.rotation.x = origShoulderX; rightShoulder.rotation.z = origShoulderZ; rightUpperArm.rotation.z = origArmZ; ownerBody.rotation.x = origBodyX; } } requestAnimationFrame(animStep); } // ==================== 爱心特效 ==================== const hearts = []; function spawnHearts(position) { const heartGroup = new THREE.Group(); const heartColor = 0xff1493; const heartMat = new THREE.MeshBasicMaterial({ color: heartColor, transparent: true, opacity: 1 }); // 用两个球体 + 一个锥体模拟爱心形状 for (let i = 0; i < 5; i++) { const h = new THREE.Group(); // 左半球 const leftGeo = new THREE.SphereGeometry(0.08, 8, 8); const left = new THREE.Mesh(leftGeo, heartMat.clone()); left.position.set(-0.05, 0.02, 0); left.scale.set(0.9, 0.9, 0.6); h.add(left); // 右半球 const right = new THREE.Mesh(leftGeo, heartMat.clone()); right.position.set(0.05, 0.02, 0); right.scale.set(0.9, 0.9, 0.6); h.add(right); // 底部锥形 const coneGeo = new THREE.ConeGeometry(0.09, 0.1, 6); const cone = new THREE.Mesh(coneGeo, heartMat.clone()); cone.position.y = -0.06; cone.rotation.z = Math.PI; h.add(cone); const scale = 0.5 + Math.random() * 0.7; h.scale.set(scale, scale, scale); h.position.set( (Math.random() - 0.5) * 0.6, 0.6 + Math.random() * 0.3, (Math.random() - 0.5) * 0.6 ); h.rotation.z = (Math.random() - 0.5) * 0.5; heartGroup.add(h); } heartGroup.position.copy(position); heartGroup.position.y += 1.0; scene.add(heartGroup); hearts.push({ group: heartGroup, startTime: performance.now(), duration: 2000, }); } function updateHearts() { const now = performance.now(); for (let i = hearts.length - 1; i >= 0; i--) { const h = hearts[i]; const elapsed = (now - h.startTime) / 1000; const t = elapsed / (h.duration / 1000); if (t >= 1) { scene.remove(h.group); hearts.splice(i, 1); continue; } // 爱心向上飘 + 旋转 + 淡出 h.group.position.y += 0.02; h.group.rotation.y += 0.03; h.group.children.forEach(child => { child.traverse(c => { if (c.material && c.material.transparent) { c.material.opacity = 1 - t; } }); }); } } function dogCatchesBall() { if (gameState.phase !== 'ownerThrow') return; const dogPos = dogGroup.position; const ballPos = ballGroup.position; const dist = new THREE.Vector2(dogPos.x - ballPos.x, dogPos.z - ballPos.z).length(); if (dist < 0.8 && !ballGroup.userData.isFlying) { gameState.phase = 'dogCatch'; gameState.canInteract = true; ballGroup.userData.isHeldByDog = true; showSpeech('接得好！快传回来！', 2500); // 球粘在狗身上 updateBallPosition(); } } function dogReturnsBall() { if (gameState.phase !== 'dogCatch') return; const dogPos = dogGroup.position; const ownerPos = ownerGroup.position; const dist = new THREE.Vector2(dogPos.x - ownerPos.x, dogPos.z - ownerPos.z).length(); if (dist < 1.5) { gameState.phase = 'dogReturn'; gameState.canInteract = false; // 球飞回主人 const ballData = ballGroup.userData; ballData.isHeldByDog = false; ballData.startPos.copy(ballGroup.position); const ownerHandPos = new THREE.Vector3(); rightHand.getWorldPosition(ownerHandPos); ballData.targetPos.copy(ownerHandPos); ballData.flyTime = 0; ballData.flyDuration = 0.8; ballData.isFlying = true; // 法斗头顶冒爱心 spawnHearts(dogGroup.position); // 显示夸奖气泡（在主人头上） const praises = ['好孩子！', '真棒小八！', '太厉害了！', '乖狗狗！', '好球！', '厉害！']; const praise = praises[Math.floor(Math.random() * praises.length)]; showSpeech(praise, 1800); setTimeout(() => { ballData.isFlying = false; ballData.isHeldByOwner = true; ballGroup.position.copy(ownerHandPos); gameState.score++; updateScore(); if (gameState.score >= 5) { winGame(); } else { gameState.phase = 'ownerThrow'; gameState.canInteract = true; showSpeech(`${gameState.score}/5！再来一次！`, 2000); setTimeout(() => ownerThrowBall(), 1500); } }, 1800); } } function winGame() { gameState.phase = 'win'; gameState.canInteract = false; scoreBox.classList.add('success'); showSpeech('太棒了小八！你做到了！', 5000); // 庆祝动画 const startTime = performance.now(); function celebrate(now) { const elapsed = (now - startTime) / 1000; if (elapsed < 5) { const bounce = Math.abs(Math.sin(elapsed * 6)) * 0.5; dogGroup.position.y = bounce; ownerGroup.position.y = bounce * 0.3; requestAnimationFrame(celebrate); } else { dogGroup.position.y = 0; ownerGroup.position.y = 0; resetGame(); } } requestAnimationFrame(celebrate); } function resetGame() { gameState.score = 0; gameState.phase = 'idle'; gameState.canInteract = true; updateScore(); scoreBox.classList.remove('success'); hideSpeech(); ballGroup.userData.isHeldByOwner = true; ballGroup.userData.isFlying = false; const ownerHandPos = new THREE.Vector3(); rightHand.getWorldPosition(ownerHandPos); ballGroup.position.copy(ownerHandPos); showSpeech('按WASD开始新游戏吧！', 3000); } function checkFail() { // 如果球落地超过5秒狗还没接到，重新开始 // 简化：不做自动失败，由用户自己控制 } function updateBallPosition() { if (ballGroup.userData.isHeldByDog && dogModel) { const dogWorldPos = new THREE.Vector3(); dogGroup.getWorldPosition(dogWorldPos); ballGroup.position.set(dogWorldPos.x, dogWorldPos.y + 0.5, dogWorldPos.z + 0.3); } if (ballGroup.userData.isHeldByOwner) { const handPos = new THREE.Vector3(); rightHand.getWorldPosition(handPos); ballGroup.position.copy(handPos); } } function updateBallShadow() { ballShadow.position.x = ballGroup.position.x; ballShadow.position.z = ballGroup.position.z; ballShadow.position.y = 0.02; const height = ballGroup.position.y; const opacity = Math.max(0, 0.3 - height * 0.05); shadowMat.opacity = opacity; const scale = 1 + height * 0.1; ballShadow.scale.set(scale, scale, scale); } // ==================== 狗WASD移动 ==================== let walkCycle = 0; const dogSpeed = 4.5; function updateDogMovement(dt) { let moveX = 0, moveZ = 0; // 相对相机方向移动 const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw)).normalize(); const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw)).normalize(); if (keyState.w) { moveX += forward.x; moveZ += forward.z; } if (keyState.s) { moveX -= forward.x; moveZ -= forward.z; } if (keyState.a) { moveX -= right.x; moveZ -= right.z; } if (keyState.d) { moveX += right.x; moveZ += right.z; } const inputLen = Math.sqrt(moveX * moveX + moveZ * moveZ); if (inputLen > 0.01) { const dirX = moveX / inputLen; const dirZ = moveZ / inputLen; const moveDist = dogSpeed * dt; dogGroup.position.x += dirX * moveDist; dogGroup.position.z += dirZ * moveDist; // 限制在围栏内 dogGroup.position.x = Math.max(-5.5, Math.min(5.5, dogGroup.position.x)); dogGroup.position.z = Math.max(-5.5, Math.min(5.5, dogGroup.position.z)); // 旋转朝向移动方向 const targetAngle = Math.atan2(dirX, dirZ); let diff = targetAngle - dogGroup.rotation.y; while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2; dogGroup.rotation.y += diff * Math.min(1, dt * 12); // 走路动画 walkCycle += dt * 10; const bounce = 0.55 + Math.abs(Math.sin(walkCycle)) * 0.12; if (dogModel) dogModel.position.y = bounce; return true; } else { walkCycle = 0; if (dogModel) dogModel.position.y += (0.55 - dogModel.position.y) * 0.1; return false; } } // ==================== 动画循环 ==================== const clock = new THREE.Clock(); function animate() { requestAnimationFrame(animate); const dt = Math.min(clock.getDelta(), 0.1); updateCamera(); // 气泡位置跟随主人 if (speechTimer > 0) { updateSpeechPosition(); speechTimer -= dt * 1000; if (speechTimer <= 0) hideSpeech(); } // 球飞行动画 const ballData = ballGroup.userData; if (ballData.isFlying) { ballData.flyTime += dt; const t = Math.min(ballData.flyTime / ballData.flyDuration, 1.0); // 抛物线 const ease = t; const arcHeight = 1.5 * Math.sin(t * Math.PI); ballGroup.position.lerpVectors(ballData.startPos, ballData.targetPos, ease); ballGroup.position.y += arcHeight; ballGroup.rotation.x += dt * 8; ballGroup.rotation.z += dt * 5; } else { updateBallPosition(); } updateBallShadow(); // 狗移动 const isDogMoving = updateDogMovement(dt); // 主人始终面向狗 const dogPos2D = new THREE.Vector2(dogGroup.position.x, dogGroup.position.z); const ownerPos2D = new THREE.Vector2(ownerGroup.position.x, ownerGroup.position.z); const lookAngle = Math.atan2(dogPos2D.x - ownerPos2D.x, dogPos2D.y - ownerPos2D.y); ownerGroup.rotation.y += (lookAngle - ownerGroup.rotation.y) * 0.05; // 呼吸动画（静止时） if (!isDogMoving && dogModel) { const breathe = 0.1 + Math.sin(performance.now() * 0.003) * 0.008; dogModel.scale.set(breathe, breathe, breathe); } // 游戏逻辑检查 if (gameState.phase === 'ownerThrow') { dogCatchesBall(); } if (gameState.phase === 'dogCatch') { dogReturnsBall(); } // 球落地后如果一直没接，过5秒自动提示 if (gameState.phase === 'ownerThrow' && !ballData.isFlying && !ballData.isHeldByOwner && !ballData.isHeldByDog) { // 不做自动重置，等用户点击 } // 爱心特效更新 updateHearts(); renderer.render(scene, camera); } animate(); // 响应窗口大小变化 window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }); console.log('法斗篮球游戏已就绪！'); console.log('规则：WASD控制法斗跑过去接球，接住后跑到主人身边传回去'); console.log('连续完成5次传球即可获胜！');"