<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>解开绳结</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0f0a;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:"Comic Sans MS","YouYuan",cursive,sans-serif}
canvas{display:block;cursor:pointer;border-radius:12px;box-shadow:0 0 40px rgba(0,0,0,0.6)}
#skipBtn{position:absolute;bottom:10px;right:10px;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.2);padding:4px 12px;border-radius:15px;font-size:11px;cursor:pointer;z-index:10;font-family:inherit}
#skipBtn:hover{background:rgba(255,255,255,0.25);color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="skipBtn" onclick="skipGame()">跳过 ⏭</button>
<script>
(function(){
const c=document.getElementById('c');
const W=800,H=600;c.width=W;c.height=H;
const ctx=c.getContext('2d');

const MAX_ERRORS=5;
let errors=0;
let gameState='playing'; // playing|win|lose
let knots=[];
let selectedPoint=null;
let dragAngle=0,startAngle=0,lastAngle=0,accumAngle=0;
let dragging=false,mouseX=0,mouseY=0;
let pulseFX=[],ropeFlash=0,straightenT=0;
let winAnimT=0,ropeBreakT=0;

// ── 绳子路径 ──
// 绳子经过3个区域，每个区域有绳结
const ropePath=generateRopePath();

function generateRopePath(){
    const pts=[];
    // 绳子从左下起，蜿蜒到右上
    const cx=W/2,cy=H/2;
    const controlPts=[
        {x:100,y:450},{x:200,y:380},{x:320,y:420},{x:450,y:350},
        {x:500,y:280},{x:600,y:240},{x:700,y:180}
    ];
    for(let i=0;i<controlPts.length-1;i++){
        const p0=controlPts[i],p1=controlPts[i+1];
        const steps=20;
        for(let s=0;s<=steps;s++){
            const t=s/steps;
            pts.push({x:p0.x+(p1.x-p0.x)*t,y:p0.y+(p1.y-p0.y)*t});
        }
    }
    return pts;
}

// ── 绳结定义 ──
// 3个绳结，位置沿绳子分布
function createKnots(){
    return [
        createKnot1(),
        createKnot2(),
        createKnot3()
    ];
}
function createKnot1(){
    const base=ropePath[Math.floor(ropePath.length*0.25)];
    const idx=ropePath.indexOf(base);
    const points=[
        {px:base.x+5,py:base.y-8,targetAngle:Math.PI*1.5,direction:'cw',label:'上圈'},
        {px:base.x+12,py:base.y+5,targetAngle:Math.PI*1.2,direction:'ccw',label:'下圈'},
    ];
    return {id:0,solved:false,points,order:[0,1]};
}
function createKnot2(){
    const base=ropePath[Math.floor(ropePath.length*0.5)];
    const idx=ropePath.indexOf(base);
    const points=[
        {px:base.x-8,py:base.y-6,targetAngle:Math.PI*1.8,direction:'cw',label:'外圈'},
        {px:base.x+6,py:base.y-3,targetAngle:Math.PI*1.4,direction:'ccw',label:'中圈'},
        {px:base.x+12,py:base.y+8,targetAngle:Math.PI*1.6,direction:'cw',label:'内圈'},
    ];
    return {id:1,solved:false,points,order:[0,1,2]};
}
function createKnot3(){
    const base=ropePath[Math.floor(ropePath.length*0.75)];
    const idx=ropePath.indexOf(base);
    const points=[
        {px:base.x-10,py:base.y-10,targetAngle:Math.PI*2.0,direction:'ccw',label:'左环'},
        {px:base.x+14,py:base.y-3,targetAngle:Math.PI*1.5,direction:'cw',label:'右环'},
        {px:base.x+4,py:base.y+10,targetAngle:Math.PI*1.8,direction:'ccw',label:'底环'},
    ];
    return {id:2,solved:false,points,order:[0,1,2]};
}

function init(){
    knots=createKnots();
    errors=0;gameState='playing';selectedPoint=null;dragging=false;
    pulseFX=[];ropeFlash=0;straightenT=0;winAnimT=0;ropeBreakT=0;
}
init();
window.skipGame=function(){knots.forEach(function(k){k.solved=true;k.points.forEach(function(p){p.solved=true;});});gameState='win';winAnimT=0;};

// ── 输入 ──
c.addEventListener('mousemove',e=>{
    const rect=c.getBoundingClientRect();
    mouseX=(e.clientX-rect.left)*W/rect.width;
    mouseY=(e.clientY-rect.top)*H/rect.height;
    if(dragging&&selectedPoint){
        const dx=mouseX-selectedPoint.px,dy=mouseY-selectedPoint.py;
        dragAngle=Math.atan2(dy,dx);
        const diff=normalizeAngle(dragAngle-lastAngle);
        accumAngle+=diff;
        lastAngle=dragAngle;
    }
});
c.addEventListener('mousedown',e=>{
    if(gameState!=='playing')return;
    const rect=c.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*W/rect.width;
    const my=(e.clientY-rect.top)*H/rect.height;
    for(let k of knots){
        if(k.solved)continue;
        const nextIdx=k.points.findIndex(p=>!p.solved);
        if(nextIdx===-1)continue;
        for(let i=0;i<k.points.length;i++){
            if(k.points[i].solved)continue;
            const p=k.points[i];
            const d=Math.hypot(mx-p.px,my-p.py);
            if(d<18){
                if(i!==nextIdx){
                    // 顺序错误
                    flashError(k,i);
                    return;
                }
                selectedPoint={knot:k,point:p,idx:i,px:p.px,py:p.py};
                dragging=true;
                startAngle=Math.atan2(my-p.py,mx-p.px);
                dragAngle=startAngle;lastAngle=startAngle;accumAngle=0;
                return;
            }
        }
    }
});
c.addEventListener('mouseup',()=>{
    if(!dragging||!selectedPoint)return;
    const p=selectedPoint.point;
    const isCW=p.direction==='cw';
    const absA=Math.abs(accumAngle);
    const correctDir=isCW?accumAngle>0:accumAngle<0;
    if(correctDir&&absA>0.4){
        p.solved=true;
        pulseFX.push({x:p.px,y:p.py,life:0.6,text:'松了！'});
        if(selectedPoint.knot.points.every(pp=>pp.solved)){
            selectedPoint.knot.solved=true;
            pulseFX.push({x:p.px,y:p.py-25,life:1,text:'绳结解开！'});
            if(knots.every(k=>k.solved)){gameState='win';winAnimT=0;}
        }
    }else{
        errors++;ropeFlash=0.3;
        if(errors>=MAX_ERRORS){gameState='lose';ropeBreakT=0;}
    }
    dragging=false;selectedPoint=null;accumAngle=0;
});
c.addEventListener('mouseleave',()=>{dragging=false;selectedPoint=null;});

// 触摸
c.addEventListener('touchmove',e=>{
    e.preventDefault();
    const rect=c.getBoundingClientRect();
    mouseX=(e.touches[0].clientX-rect.left)*W/rect.width;
    mouseY=(e.touches[0].clientY-rect.top)*H/rect.height;
    if(dragging&&selectedPoint){
        const dx=mouseX-selectedPoint.px,dy=mouseY-selectedPoint.py;
        dragAngle=Math.atan2(dy,dx);
        const diff=normalizeAngle(dragAngle-lastAngle);
        accumAngle+=diff;
        lastAngle=dragAngle;
    }
},{passive:false});
c.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(gameState!=='playing')return;
    const rect=c.getBoundingClientRect();
    const mx=(e.touches[0].clientX-rect.left)*W/rect.width;
    const my=(e.touches[0].clientY-rect.top)*H/rect.height;
    for(let k of knots){
        if(k.solved)continue;
        const nextIdx=k.points.findIndex(p=>!p.solved);
        if(nextIdx===-1)continue;
        for(let i=0;i<k.points.length;i++){
            if(k.points[i].solved)continue;
            const p=k.points[i];
            if(Math.hypot(mx-p.px,my-p.py)<22){
                if(i!==nextIdx){flashError(k,i);return;}
                selectedPoint={knot:k,point:p,idx:i,px:p.px,py:p.py};
                dragging=true;startAngle=Math.atan2(my-p.py,mx-p.px);
                dragAngle=startAngle;lastAngle=startAngle;accumAngle=0;
                return;
            }
        }
    }
},{passive:false});
c.addEventListener('touchend',()=>{
    if(!dragging||!selectedPoint)return;
    const p=selectedPoint.point;
    const isCW=p.direction==='cw';
    const absA=Math.abs(accumAngle);
    if((isCW?accumAngle>0:accumAngle<0)&&absA>0.4){
        p.solved=true;
        pulseFX.push({x:p.px,y:p.py,life:0.6,text:'松了！'});
        if(selectedPoint.knot.points.every(pp=>pp.solved)){
            selectedPoint.knot.solved=true;
            if(knots.every(k=>k.solved)){gameState='win';winAnimT=0;}
        }
    }else{
        errors++;ropeFlash=0.3;
        if(errors>=MAX_ERRORS){gameState='lose';ropeBreakT=0;}
    }
    dragging=false;selectedPoint=null;accumAngle=0;
});

function normalizeAngle(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}
function flashError(knot,idx){
    ropeFlash=0.3;errors++;
    if(errors>=MAX_ERRORS){gameState='lose';ropeBreakT=0;}
}

// 结局点击
document.addEventListener('click',function(e){
    if(gameState==='win'&&winAnimT>1.5){
        var ret=localStorage.getItem('knotGameReturn')||'index.html';
        localStorage.removeItem('knotGameReturn');
        window.location.href=ret;
    }
    if(gameState==='lose'&&ropeBreakT>1.5){
        location.reload();
    }
});
document.addEventListener('touchend',function(e){
    if(gameState==='win'&&winAnimT>1.5){
        var ret=localStorage.getItem('knotGameReturn')||'index.html';
        localStorage.removeItem('knotGameReturn');
        window.location.href=ret;
    }
    if(gameState==='lose'&&ropeBreakT>1.5){
        location.reload();
    }
});

function update(dt){
    if(ropeFlash>0)ropeFlash-=dt;
    if(gameState==='win')winAnimT+=dt;
    if(gameState==='lose')ropeBreakT+=dt;
    for(let i=pulseFX.length-1;i>=0;i--){
        pulseFX[i].life-=dt;
        if(pulseFX[i].life<=0)pulseFX.splice(i,1);
    }
}

function drawRope(){
    const pts=ropePath;
    if(gameState==='win'&&winAnimT>0.8){
        const cx=W/2,cy=H/2;
        const p2=Math.min(1,(winAnimT-0.8)/0.8);
        for(let i=0;i<pts.length;i++){
            const t=i/pts.length;
            const r=30+p2*120;
            const a=t*Math.PI*3;
            pts[i].x=cx+Math.cos(a)*r*(1-p2*0.6)+pts[i].x*p2;
            pts[i].y=cy+Math.sin(a)*r*(1-p2*0.6)+pts[i].y*p2;
        }
    }
    if(gameState==='lose'&&ropeBreakT>0.5){
        const brk=Math.floor(pts.length*0.53);
        pts.splice(brk+1);
    }

    // 先画绳结区域的底层缠绕
    drawKnotShapes(true); // 阴影层
    // 主绳子
    drawRopeBody(pts);
    // 绳结上层
    drawKnotShapes(false);
}

function drawRopeBody(pts){
    // 阴影
    drawRopeLayer(pts,3,3,'rgba(30,15,5,0.25)',12);
    // 深色底边
    drawRopeLayer(pts,1,1,'rgba(50,30,15,0.4)',10);
    // 主体
    drawRopeLayer(pts,0,0,ropeFlash>0?'#D32F2F':'#8B5E3C',8);
    // 双股扭绞：两股交替纹路
    ctx.save();
    for(let strand=0;strand<2;strand++){
        const offY=strand===0?-2:2;
        ctx.strokeStyle=ropeFlash>0?'rgba(255,180,180,0.25)':'rgba(210,180,140,0.25)';
        ctx.lineWidth=1.5;ctx.lineCap='round';
        for(let i=1+strand;i<pts.length-2;i+=5){
            const px=pts[i].x,py=pts[i].y+offY;
            const pn=pts[i+2];if(!pn)break;
            const dx=pn.x-px,dy=pn.y-py;
            const len=Math.hypot(dx,dy);
            if(len<1)continue;
            const nx=dx/len,ny=dy/len;
            ctx.beginPath();
            ctx.moveTo(px-ny*4+offY,py+nx*4);
            ctx.lineTo(px+ny*4-offY,py-nx*4);
            ctx.stroke();
        }
    }
    ctx.restore();
    // 高光
    drawRopeLayer(pts,0,-2,ropeFlash>0?'rgba(255,150,150,0.2)':'rgba(230,210,180,0.2)',2.5);
}

function drawRopeLayer(pts,ox,oy,color,width){
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(pts[0].x+ox,pts[0].y+oy);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x+ox,pts[i].y+oy);
    ctx.stroke();
}

// ── 绳结造型绘制 ──
function drawKnotShapes(isShadow){
    for(let k of knots){
        if(k.solved)continue;
        const bp=k.points[0];if(!bp)continue;
        const cx=bp.px,cy=bp.py;
        const r=36;
        ctx.save();
        ctx.translate(cx,cy);

        if(isShadow){
            drawKnotGeometry(k,r,'rgba(40,20,5,0.4)',8,3,3);
        }else{
            const color=ropeFlash>0?'#C62828':'#7A4E30';
            drawKnotGeometry(k,r,color,7,0,0);
            drawKnotGeometry(k,r,'rgba(200,160,120,0.18)',2,0,-1);
        }
        ctx.restore();
    }
    ctx.globalAlpha=1;
}

function drawKnotGeometry(k,r,color,lw,ox,oy){
    ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';
    if(k.id===0){
        // 8字单环
        if(!k.points[0].solved){
            ctx.beginPath();ctx.ellipse(ox,-r*0.35+oy,r*0.55,r*0.32,0.3,0,Math.PI*2);ctx.stroke();
        }
        if(!k.points[1].solved){
            ctx.beginPath();ctx.ellipse(ox,r*0.3+oy,r*0.52,r*0.3,-0.15,0,Math.PI*2);ctx.stroke();
            if(!k.points[0].solved){
                ctx.beginPath();ctx.moveTo(ox-r*0.4,oy-r*0.5);ctx.quadraticCurveTo(ox,oy,ox+r*0.4,oy+r*0.3);ctx.stroke();
            }
        }
    }else if(k.id===1){
        // 单螺旋
        const pts2=[];
        for(let t=0;t<45;t++){
            const a=t/45*Math.PI*2.2;
            const rr2=r*(0.6+t*0.004);
            pts2.push([Math.cos(a)*rr2*0.5+ox,Math.sin(a)*rr2*0.38+oy]);
        }
        ctx.beginPath();ctx.moveTo(pts2[0][0],pts2[0][1]);
        for(let i=1;i<pts2.length;i++)ctx.lineTo(pts2[i][0],pts2[i][1]);
        ctx.stroke();
    }else if(k.id===2){
        // 双环（左右各一）
        ctx.beginPath();ctx.ellipse(-r*0.3+ox,oy,r*0.5,r*0.35,-0.3,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.ellipse(r*0.3+ox,oy,r*0.45,r*0.3,0.3,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(-r*0.55+ox,-r*0.1+oy);ctx.quadraticCurveTo(ox,oy-5,r*0.55+ox,-r*0.1+oy);ctx.stroke();
    }
}

function draw(){
    ctx.clearRect(0,0,W,H);
    // 背景
    ctx.fillStyle='#2E1A0E';
    ctx.fillRect(0,0,W,H);
    for(let i=0;i<8;i++){
        ctx.strokeStyle='rgba(60,40,25,0.4)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(0,i*80);ctx.lineTo(W,i*80);ctx.stroke();
    }

    drawRope();

    // 绳结交叉点
    for(let k of knots){
        if(k.solved)continue;
        const nextIdx=k.points.findIndex(p=>!p.solved);
        for(let i=0;i<k.points.length;i++){
            const p=k.points[i];
            if(p.solved)continue;
            const isNext=i===nextIdx;
            const isActive=selectedPoint&&selectedPoint.point===p;
            const r=12;
            // 光晕
            ctx.beginPath();ctx.arc(p.px,p.py,r+4,0,Math.PI*2);
            ctx.fillStyle=isActive?'rgba(255,255,255,0.4)':(isNext?'rgba(255,215,0,0.3)':'rgba(100,100,100,0.2)');
            ctx.fill();
            // 圆环
            ctx.beginPath();ctx.arc(p.px,p.py,r,0,Math.PI*2);
            ctx.strokeStyle=isActive?'#fff':(isNext?'#FFD700':'rgba(180,150,100,0.6)');
            ctx.lineWidth=2.5;ctx.stroke();
            // 方向箭头
            const arrAngle=p.direction==='cw'?Math.PI/2:-Math.PI/2;
            ctx.fillStyle=isActive?'#fff':'#FFD700';
            ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText(p.direction==='cw'?'↻':'↺',p.px,p.py-r-8);
            // 拖拽进度弧
            if(isActive&&dragging){
                const sp=selectedPoint;
                ctx.beginPath();
                ctx.arc(sp.px,sp.py,r+8,startAngle,lastAngle,accumAngle<0);
                ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=3;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(sp.px+Math.cos(lastAngle)*(r+8),sp.py+Math.sin(lastAngle)*(r+8),4,0,Math.PI*2);
                ctx.fillStyle='#fff';ctx.fill();
            }
        }
    }

    // 特效
    for(let fx of pulseFX){
        ctx.fillStyle='rgba(76,175,80,'+fx.life+')';
        ctx.font='bold 16px "Comic Sans MS","YouYuan",sans-serif';
        ctx.textAlign='center';
        ctx.fillText(fx.text,fx.x,fx.y-fx.life*30);
    }

    // UI
    const solved=knots.filter(k=>k.solved).length;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(10,10,130,40);
    ctx.fillStyle='#FFE4B5';ctx.font='bold 22px "Comic Sans MS","YouYuan",sans-serif';
    ctx.textAlign='left';ctx.fillText('绳结：'+solved+'/3',18,42);

    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(W-130,10,120,40);
    ctx.fillStyle=errors>=4?'#EF5350':'#FFE4B5';
    ctx.textAlign='right';ctx.fillText('错误：'+errors+'/'+MAX_ERRORS,W-20,42);
    ctx.textAlign='left';

    // 操作提示
    if(gameState==='playing'){
        ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(W/2-170,50,340,28);
        ctx.fillStyle='rgba(255,228,181,0.85)';ctx.font='13px "Comic Sans MS","YouYuan",sans-serif';
        ctx.textAlign='center';
        ctx.fillText('点击金色圆环 → 沿箭头方向拖拽画弧 → 松手',W/2,70);
        ctx.textAlign='left';
    }

    // 当前选中绳结状态
    if(selectedPoint){
        const k=selectedPoint.knot;
        const done=k.points.filter(p=>p.solved).length;
        const total=k.points.length;
        ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(W/2-60,50,120,25);
        ctx.fillStyle='#FFE4B5';ctx.font='13px "Comic Sans MS","YouYuan",sans-serif';
        ctx.textAlign='center';ctx.fillText('交叉点：'+done+'/'+total,W/2,68);
    }

    // 红闪
    if(ropeFlash>0){
        ctx.fillStyle='rgba(255,0,0,'+(ropeFlash*0.2)+')';
        ctx.fillRect(0,0,W,H);
    }

    // 结束
    if(gameState==='win'&&winAnimT>2){
        ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#FFD700';ctx.font='bold 26px "Comic Sans MS","YouYuan",sans-serif';
        ctx.textAlign='center';ctx.fillText('……终于理顺了。',W/2,H/2-10);
        ctx.fillStyle='#DDD';ctx.font='14px "Comic Sans MS","YouYuan",sans-serif';
        ctx.fillText('按任意位置返回',W/2,H/2+25);
    }
    if(gameState==='lose'&&ropeBreakT>1.5){
        ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#EF5350';ctx.font='bold 26px "Comic Sans MS","YouYuan",sans-serif';
        ctx.textAlign='center';ctx.fillText('……太旧了，一扯就断了。',W/2,H/2-10);
        ctx.fillStyle='#DDD';ctx.font='14px "Comic Sans MS","YouYuan",sans-serif';
        ctx.fillText('按任意位置重试',W/2,H/2+25);
    }
}

let lastTime=performance.now();
function loop(time){
    const dt=Math.min((time-lastTime)/1000,0.1);lastTime=time;
    update(dt);draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
